<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arène des bots NQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&display=swap">
<style>
/* Arène : chaque bot et chaque variante est une crête de relief (temps vers la droite, gain cumulé en hauteur).
   Même famille que la station : noir, ambre, Plex. Un seul thème sombre, choisi exprès. */
:root {
  --noir: #000; --panneau: #0b0b0c; --panneau2: #131316; --trait: #26262b; --grille: #18181b;
  --ambre: #ffa028; --blanc: #f0efea; --gris: #8d8d95; --gris2: #55555d; --hausse: #2fd16f; --baisse: #ff5a5a; --cyan: #3cc8ff;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; --cond: "IBM Plex Sans Condensed", "Arial Narrow", Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--noir); height: 100%; }
body { margin: 0; color: var(--blanc); font: 13px/1.45 var(--mono); padding: env(safe-area-inset-top, 0px) max(12px, env(safe-area-inset-right, 0px)) 12px max(12px, env(safe-area-inset-left, 0px));
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 8px; }
.tete { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; border-bottom: 1px solid var(--trait); padding-block: 8px 6px; }
.logo { font: 700 14px var(--cond); letter-spacing: .08em; color: #000; background: var(--ambre); padding: 2px 8px; }
.phase { font: 600 15px var(--cond); color: var(--ambre); letter-spacing: .04em; }
.detail { color: var(--gris); min-width: 0; flex: 1 1 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.barre { width: 180px; height: 6px; background: var(--grille); border: 1px solid var(--trait); position: relative; }
.barre i { position: absolute; inset: 0 auto 0 0; background: var(--ambre); width: 0; transition: width .4s; }
.pouls { display: inline-flex; align-items: center; gap: 6px; font: 700 12px var(--cond); letter-spacing: .1em; color: var(--hausse); border: 1px solid currentColor; padding: 0 7px; }
.pouls i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: p 1.2s infinite; }
.pouls.arret { color: var(--gris); } .pouls.arret i { animation: none; }
@keyframes p { 50% { opacity: .25; } }
.corps { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 720px); gap: 8px; min-height: 0; }
@media (max-width: 1300px) { body { height: auto; grid-template-rows: auto auto auto; } .corps { grid-template-columns: minmax(0, 1fr); } .scene { height: 62vh; } }
.panneau { background: var(--panneau); border: 1px solid var(--trait); min-height: 0; min-width: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); }
.panneau h2 { margin: 0; font: 600 12px var(--cond); letter-spacing: .1em; text-transform: uppercase; color: var(--ambre); background: var(--panneau2); padding: 5px 8px;
  border-bottom: 1px solid var(--trait); display: flex; justify-content: space-between; gap: 8px; }
.panneau h2 span { color: var(--gris); text-transform: none; letter-spacing: 0; font: 400 12px var(--mono); }
.scene { position: relative; min-height: 340px; overflow: hidden; }
.scene canvas { display: block; width: 100%; height: 100%; }
.etiq span { position: absolute; transform: translate(-100%, -50%); font: 11px var(--mono); white-space: nowrap; pointer-events: none; padding-right: 6px; text-shadow: 0 0 4px #000; }
.etiq span.tue { color: var(--gris2); text-decoration: line-through; }
.droite { display: grid; grid-template-rows: minmax(0, 1.4fr) minmax(0, 1fr); gap: 8px; min-height: 0; }
.defile { overflow: auto; min-height: 0; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 12px; }
th, td { padding: 3px 6px; text-align: right; border-bottom: 1px solid var(--grille); white-space: nowrap; }
th { color: var(--gris); font: 600 11px var(--cond); letter-spacing: .05em; text-transform: uppercase; position: sticky; top: 0; background: var(--panneau); }
td:first-child, th:first-child { text-align: left; }
td:first-child { max-width: 250px; overflow: hidden; text-overflow: ellipsis; }
td:first-child i { display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 2px; }
tr.tue td { color: var(--gris2); }
.puce { font: 600 10px var(--cond); letter-spacing: .08em; border: 1px solid currentColor; padding: 0 5px; }
.h { color: var(--hausse); } .b { color: var(--baisse); } .a { color: var(--ambre); } .g { color: var(--gris); } .c { color: var(--cyan); }
.journal { font-size: 12px; display: grid; align-content: start; }
.journal div { display: grid; grid-template-columns: 7ch minmax(0, 1fr); gap: 8px; padding: 2px 8px; border-bottom: 1px solid var(--grille); }
.journal div.neuf { animation: neuf 1.6s ease-out; }
@keyframes neuf { from { background: rgba(255,160,40,.25); } to { background: transparent; } }
.bas { display: flex; flex-wrap: wrap; gap: 4px 18px; color: var(--gris); font-size: 12px; }
.bas b { color: var(--blanc); font-weight: 500; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header class="tete">
  <span class="logo">NQ · ARÈNE</span>
  <span class="pouls" id="pouls"><i></i><span>EN DIRECT</span></span>
  <span class="phase" id="phase">connexion…</span>
  <span class="barre" aria-hidden="true"><i id="prog"></i></span>
  <span class="detail" id="detail"></span>
</header>
<main class="corps">
  <section class="panneau"><h2>Relief des bots et des variantes <span id="echelle">hauteur = gain cumulé, 1 MNQ</span></h2>
    <div class="scene" id="scene"><div class="etiq" id="etiq"></div></div></section>
  <div class="droite">
    <section class="panneau"><h2>Classement <span id="nb"></span></h2><div class="defile"><table id="classement"></table></div></section>
    <section class="panneau"><h2>Ce que je fais <span id="maj"></span></h2><div class="defile"><div class="journal" id="journal"></div></div></section>
  </div>
</main>
<footer class="bas" id="bas"></footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const nf = (v, d = 0) => v == null || !isFinite(v) ? "—" : (Math.abs(v) < .5 * 10 ** -d ? 0 : v).toLocaleString("fr-FR", { minimumFractionDigits: d, maximumFractionDigits: d });
const sg = (v, d = 0) => v == null || !isFinite(v) ? "—" : (v > 0 ? "+" : v < 0 ? "−" : "") + nf(Math.abs(v), d);
const pc = v => v == null || !isFinite(v) ? "—" : nf(v * 100) + " %";
const cl = v => v > 0 ? "h" : v < 0 ? "b" : "g";
const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let E = null, version = -1, vus = new Set(), dernier = 0;

// ------------------------------------------------------------------ relief three.js
const R = { ok: false };
function initScene() {
  const T = window.THREE; if (!T || !T.OrbitControls) { $("scene").insertAdjacentHTML("beforeend", '<p class="g" style="padding:16px">Le relief a besoin de WebGL et de Three.js (connexion internet).</p>'); return; }
  let r; try { r = new T.WebGLRenderer({ antialias: true }); } catch (e) { return; }
  r.setPixelRatio(Math.min(2, devicePixelRatio || 1)); $("scene").insertBefore(r.domElement, $("etiq"));
  const sc = new T.Scene(); sc.background = new T.Color(0x000000); sc.fog = new T.FogExp2(0x000000, .018);
  const cam = new T.PerspectiveCamera(42, 1, .1, 400); cam.position.set(0, 14, 26);
  const ctl = new T.OrbitControls(cam, r.domElement); ctl.enableDamping = true; ctl.target.set(0, 1, 0);
  ctl.autoRotate = !matchMedia("(prefers-reduced-motion: reduce)").matches; ctl.autoRotateSpeed = .25;
  sc.add(new T.GridHelper(40, 40, 0x2a2a2a, 0x121212));
  const groupe = new T.Group(); sc.add(groupe);
  const scan = new T.Mesh(new T.PlaneGeometry(.06, 1, 1, 1), new T.MeshBasicMaterial({ color: 0xffa028, transparent: true, opacity: .18, side: T.DoubleSide, depthWrite: false }));
  sc.add(scan);
  Object.assign(R, { ok: true, T, r, sc, cam, ctl, groupe, scan, labs: [], rangs: {} });
  const redim = () => { const w = $("scene").clientWidth, h = $("scene").clientHeight; if (!w) return; r.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); };
  new ResizeObserver(redim).observe($("scene")); redim();
  const v3 = new T.Vector3();
  const boucle = () => { ctl.update(); r.render(sc, cam);
    const w = $("scene").clientWidth, h = $("scene").clientHeight;
    R.labs.forEach(l => { v3.copy(l.p).project(cam); l.s.style.left = (v3.x + 1) / 2 * w + "px"; l.s.style.top = (1 - v3.y) / 2 * h + "px"; l.s.style.display = v3.z < 1 ? "" : "none"; });
    requestAnimationFrame(boucle); };
  boucle();
}
function couleur(T, v, mx, tue) {
  if (tue) return new T.Color(0x3a3a40);
  const u = Math.min(1, Math.abs(v) / (mx || 1));
  return v >= 0 ? new T.Color(0x0b2a18).lerp(new T.Color(0x2fd16f), .35 + .65 * u) : new T.Color(0x2a0b0b).lerp(new T.Color(0xff5a5a), .35 + .65 * u);
}
function dessiner() {
  if (!R.ok || !E) return;
  const T = R.T, lignes = E.lignes || [], n = (E.jours || []).length; if (!n || !lignes.length) return;
  while (R.groupe.children.length) { const o = R.groupe.children.pop(); o.geometry.dispose(); }
  $("etiq").innerHTML = ""; R.labs = [];
  const larg = 30, prof = Math.max(6, Math.min(26, lignes.length * 1.1)), X = i => -larg / 2 + larg * i / Math.max(1, n - 1);
  let mx = 1; lignes.forEach(l => (l.courbe || []).forEach(v => { if (v != null) mx = Math.max(mx, Math.abs(v)); }));
  const H = v => v / mx * 7;
  lignes.forEach((l, k) => {
    const z = lignes.length === 1 ? 0 : -prof / 2 + prof * k / (lignes.length - 1), tue = l.statut === "tué", c = l.courbe || [], m = c.length;
    if (m < 2) return;
    const pos = [], col = [], idx = [], ecr = tue ? .25 : 1;
    for (let i = 0; i < m; i++) { const y = H(c[i] || 0) * ecr, cc = couleur(T, c[i] || 0, mx, tue);
      pos.push(X(i), 0, z - .32, X(i), y, z, X(i), 0, z + .32); for (let q = 0; q < 3; q++) col.push(cc.r * (q === 1 ? 1 : .45), cc.g * (q === 1 ? 1 : .45), cc.b * (q === 1 ? 1 : .45));
      if (i) { const a = 3 * (i - 1), b = 3 * i; idx.push(a, b, a + 1, b, b + 1, a + 1, a + 1, b + 1, a + 2, b + 1, b + 2, a + 2); } }
    const g = new T.BufferGeometry(); g.setAttribute("position", new T.Float32BufferAttribute(pos, 3)); g.setAttribute("color", new T.Float32BufferAttribute(col, 3)); g.setIndex(idx); g.computeVertexNormals();
    R.groupe.add(new T.Mesh(g, new T.MeshBasicMaterial({ vertexColors: true, side: T.DoubleSide, transparent: true, opacity: tue ? .35 : .92 })));
    const crete = []; for (let i = 0; i < m; i++) crete.push(new T.Vector3(X(i), H(c[i] || 0) * ecr + .02, z));
    R.groupe.add(new T.Line(new T.BufferGeometry().setFromPoints(crete), new T.LineBasicMaterial({ color: tue ? 0x55555d : new T.Color(l.couleur || "#ffffff") })));
    if (!tue && (l.statut === "référence" || l.id.startsWith("usine") || lignes.length <= 14)) {
      const s = document.createElement("span"); s.textContent = l.nom; s.style.color = l.couleur || "#fff";
      $("etiq").appendChild(s); R.labs.push({ s, p: new T.Vector3(X(0) - .4, .3, z) }); }
  });
  const cur = Math.max(0, Math.min(n - 1, E.curseur == null ? n - 1 : E.curseur));
  R.sc.remove(R.scan); R.scan.geometry.dispose();
  R.scan = new T.Mesh(new T.BoxGeometry(.03, 9, prof + 1), R.scan.material); R.scan.position.set(X(cur), 4.5, 0); R.sc.add(R.scan);
  $("echelle").textContent = `hauteur = gain cumulé, 1 MNQ · sommet ${sg(mx)} $ · curseur ${E.jours[cur] || ""}`;
}

// ------------------------------------------------------------------ panneaux
function panneaux() {
  $("phase").textContent = E.phase || ""; $("detail").textContent = E.detail || "";
  $("prog").style.width = Math.round((E.progression || 0) * 100) + "%";
  const lignes = (E.lignes || []).slice().sort((a, b) => (b.tri ?? -1e9) - (a.tri ?? -1e9));
  $("nb").textContent = `${lignes.filter(l => l.statut !== "tué").length} en vie · ${lignes.filter(l => l.statut === "tué").length} tuées`;
  const st = l => { const s = l.stats || {};
    const puce = l.statut === "tué" ? '<span class="puce b">TUÉE</span>' : l.statut === "retenu" ? '<span class="puce h">RETENUE</span>' : l.statut === "référence" ? '<span class="puce a">BOT</span>' : '<span class="puce g">EN TEST</span>';
    return `<tr class="${l.statut === "tué" ? "tue" : ""}" title="${esc(l.raison || "")}"><td><i style="background:${l.couleur || "#fff"}"></i>${esc(l.nom)}</td><td class="${cl(s.par_seance)}">${sg(s.par_seance, 1)}</td><td>${s.t == null ? "—" : nf(s.t, 2)}</td>`
      + `<td class="${cl(s.t_apres)}">${s.t_apres == null ? "—" : nf(s.t_apres, 2)}</td><td class="b">${s.pire_baisse == null ? "—" : sg(s.pire_baisse)}</td><td>${pc(s.survie_60)}</td><td class="h">${s.retire_an == null ? "—" : nf(s.retire_an)}</td><td class="${(s.grilles || 0) > 1 ? "b" : ""}">${s.grilles == null ? "—" : s.grilles}</td><td class="${cl(s.periode)}">${sg(s.periode)}</td><td>${puce}</td></tr>`; };
  $("classement").innerHTML = `<thead><tr><th>Bot ou variante</th><th>$/séance</th><th>t</th><th>t 2023+</th><th>pire baisse</th><th title="Compte financé neuf encore en vie 60 séances après le départ (tous les départs de 2014 à 2026)">survie 60 j</th><th title="Retiré par an en vrai : retraits toutes les 20 séances au-dessus de 52 600 $, règle de constance 40 %">retiré/an</th><th title="Comptes financés grillés en 13 ans avec ces retraits">grillés</th><th title="Résultat du 11 août au 2 novembre 2026">11/08→02/11</th><th></th></tr></thead><tbody>${lignes.map(st).join("")}</tbody>`;
  const j = $("journal");
  (E.journal || []).forEach(e => { const k = e.t + e.txt; if (vus.has(k)) return; vus.add(k);
    const d = document.createElement("div"); if (version >= 0) d.className = "neuf"; d.innerHTML = `<span class="a">${esc(e.t)}</span><span class="${e.cls || ""}">${esc(e.txt)}</span>`; j.prepend(d); });
  while (j.children.length > 200) j.lastChild.remove();
  $("bas").innerHTML = (E.pied || []).map(([a, b]) => `<span>${esc(a)} <b>${esc(b)}</b></span>`).join("");
}
async function lire() {
  try {
    const r = await fetch("etat.json?" + Date.now(), { cache: "no-store" }); if (!r.ok) throw 0;
    const e = await r.json(); dernier = Date.now();
    if (e.version !== version) {
      E = e; version = e.version;
      if (lire.courbes) E.lignes.forEach(l => { l.courbe = lire.courbes[l.id] || []; });
      panneaux();
      if (e.version_relief !== (lire.vr ?? -1)) {
        try { const q = await fetch("relief.json?" + Date.now(), { cache: "no-store" }); if (q.ok) { const rel = await q.json(); lire.vr = rel.version_relief; lire.courbes = rel.courbes;
          E.jours = rel.jours; E.lignes.forEach(l => { l.courbe = rel.courbes[l.id] || []; }); dessiner(); } } catch (x) {}
      } else if (R.ok && R.scan) { const n = (E.jours || []).length, cur = Math.max(0, Math.min(n - 1, E.curseur ?? n - 1)); R.scan.position.x = -15 + 30 * cur / Math.max(1, n - 1); }
    }
  } catch (e) {}
  const age = (Date.now() - dernier) / 1000, fini = E && E.fini;
  $("pouls").className = "pouls" + (fini || age > 10 ? " arret" : ""); $("pouls").lastChild.textContent = fini ? "TERMINÉ" : age > 10 ? "EN ATTENTE" : "EN DIRECT";
  $("maj").textContent = E ? `mis à jour il y a ${nf(age)} s` : "";
}
initScene(); lire(); setInterval(lire, 1000);
</script>
</body>
</html>
