name: Donnees CME minute (Databento)

# La cle API est lue uniquement dans le secret du depot DATABENTO_API_KEY
# (Settings > Secrets and variables > Actions). Elle n'apparait jamais dans les fichiers ni les logs.

on:
  push:
    branches: [claude/keen-babbage-r686cl]
    paths:
      - intraday/telecharger_databento.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  telecharger:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Telecharger les barres minute ES et NQ
        env:
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
        run: |
          [ -n "$DATABENTO_API_KEY" ] || { echo "::error::Secret DATABENTO_API_KEY absent"; exit 1; }
          pip install -q databento pandas
          python3 intraday/telecharger_databento.py
      - name: Enregistrer les donnees sur la branche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add intraday/donnees/sp500_1min.csv.gz intraday/donnees/nasdaq100_1min.csv.gz
          git diff --cached --quiet && exit 0
          git commit -m "Donnees minute CME (Databento) : ES et NQ"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
