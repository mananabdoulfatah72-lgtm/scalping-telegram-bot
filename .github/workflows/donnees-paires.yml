name: Donnees paires (actions)

on:
  push:
    branches: [claude/keen-babbage-r686cl]
    paths:
      - paires/telecharger_actions.py
      - .github/workflows/donnees-paires.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  telecharger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Telecharger les cours
        run: |
          pip install yfinance pandas
          python3 paires/telecharger_actions.py
      - name: Enregistrer les donnees sur la branche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paires/donnees/actions.csv.gz
          git diff --cached --quiet && exit 0
          git commit -m "Donnees actions pour les paires"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
