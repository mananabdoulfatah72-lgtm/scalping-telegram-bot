name: Donnees vague 4 (Alpaca, minutes des 10 plus grosses valeurs du Nasdaq 100, gratuit)

# Cles lues uniquement dans les secrets du depot ALPACA_API_KEY_ID et ALPACA_API_SECRET_KEY.
# Lance par Claude en poussant vague4/lancer_grandes.txt.

on:
  push:
    branches: [claude/keen-babbage-r686cl]
    paths:
      - vague4/lancer_grandes.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  telecharger:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Telecharger
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: |
          [ -n "$ALPACA_API_KEY_ID" ] && [ -n "$ALPACA_API_SECRET_KEY" ] || { echo "::error::Secrets ALPACA_API_KEY_ID / ALPACA_API_SECRET_KEY absents"; exit 1; }
          pip install -q pandas numpy requests
          python3 vague4/grandes_valeurs.py
      - name: Enregistrer sur la branche
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vague4/donnees 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Donnees : minutes des 10 plus grosses valeurs du Nasdaq 100 (vague 4, Alpaca)"
          for essai in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 10
          done
          exit 1
