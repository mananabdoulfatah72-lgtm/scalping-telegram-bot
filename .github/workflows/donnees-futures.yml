name: Donnees fonds (40 futures CME, Databento)

# Cle API lue uniquement dans le secret du depot DATABENTO_API_KEY.

on:
  push:
    branches: [claude/keen-babbage-r686cl]
    paths:
      - fonds/telecharger_futures.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  telecharger:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Telecharger
        env:
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
        run: |
          [ -n "$DATABENTO_API_KEY" ] || { echo "::error::Secret DATABENTO_API_KEY absent"; exit 1; }
          pip install -q databento pandas
          python3 fonds/telecharger_futures.py
      - name: Enregistrer sur la branche
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A fonds/donnees
          git diff --cached --quiet && exit 0
          if [ -f fonds/donnees/futures_1d.csv.gz ]; then MSG="Donnees : 40 futures CME journaliers (Databento)"; else MSG="Donnees : commande Databento en preparation"; fi
          git commit -m "$MSG"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
