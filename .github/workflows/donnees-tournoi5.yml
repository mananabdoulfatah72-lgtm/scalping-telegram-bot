name: "Donnees tournoi 5 - devises, ZN, bitcoin (Databento), adjudications du Tresor"

# Cle API lue uniquement dans le secret du depot DATABENTO_API_KEY.

on:
  push:
    branches: [claude/keen-babbage-r686cl]
    paths:
      - tournoi5/telecharger.py
      - .github/workflows/donnees-tournoi5.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  telecharger:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Telecharger
        env:
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
        run: |
          pip install -q databento pandas
          python3 tournoi5/telecharger.py
      - name: Enregistrer sur la branche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tournoi5/donnees
          git diff --cached --quiet && exit 0
          git commit -m "Donnees : devises, ZN, bitcoin, adjudications (tournoi 5)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
