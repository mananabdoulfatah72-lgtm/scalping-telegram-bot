name: Robot multi-marches (argent virtuel)

on:
  schedule:   # GitHub saute parfois un passage : horaires de secours (le robot ne refait jamais un jour deja joue)
    - cron: "30 22 * * 1-5"
    - cron: "30 0 * * 2-6"
    - cron: "30 3 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write

concurrency: robot-tendance   # chaque robot a sa file ; la page generale est mise a jour par page-generale.yml

jobs:
  robot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dependances
        run: pip install yfinance pandas numpy requests

      - name: Lancer le robot
        working-directory: tendance
        run: python3 robot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}

      - name: Sauvegarder le compte virtuel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tendance/robot/
          git diff --cached --quiet && exit 0
          git commit -m "Robot tendance : mise a jour du compte virtuel"
          for essai in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 10
          done
          exit 1
