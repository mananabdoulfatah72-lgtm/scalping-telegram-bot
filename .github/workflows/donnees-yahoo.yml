name: Donnees intraday (Yahoo, 2 ans)

on:
  push:
    branches: [claude/keen-babbage-r686cl]
    paths:
      - intraday/telecharger_yahoo.py
      - .github/workflows/donnees-yahoo.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  telecharger:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Telecharger les barres horaires Yahoo
        run: |
          pip install yfinance pandas
          python3 intraday/telecharger_yahoo.py
      - name: Enregistrer les donnees sur la branche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add intraday/donnees/yahoo_*.csv.gz
          git diff --cached --quiet && exit 0
          git commit -m "Donnees horaires Yahoo (SPY, QQQ, ES, NQ)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
