name: Usine a strategies (4 portes) et brief du matin

# Le brief part le matin (heure de Paris) : la seance de New York finit a 22 h et ses minutes arrivent la nuit (robot zone).
# Du mardi au samedi : idees nouvelles seulement, tableau, brief Telegram (consigne du compte).
# Le dimanche : toutes les portes refaites pour les strategies en service (zone, Supertrend), sur les minutes les plus recentes.
on:
  schedule:
    - cron: "15 6 * * 2-6"
    - cron: "0 6 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency: usine

jobs:
  usine:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dependances
        run: pip install numpy pandas numba requests

      - name: Minutes du NQ 2011 - 2025 (branche de recherche)
        run: |
          git fetch --depth=1 origin claude/keen-babbage-r686cl
          git show FETCH_HEAD:intraday/donnees/nasdaq100_1min.csv.gz > "$RUNNER_TEMP/nasdaq100_1min.csv.gz"

      - name: Etat du compte reel (cache GitHub, jamais commite ni imprime : le depot est public)
        uses: actions/cache@v4
        with:
          path: |
            usine/compte.json
            usine/journal_reel.csv
          key: usine-compte-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: usine-compte-

      - name: Portes
        env:
          KB_MINUTES: ${{ runner.temp }}/nasdaq100_1min.csv.gz
        run: |
          if [ "$(date -u +%u)" = "7" ]; then
            python3 usine/portes.py zone supertrend
          else
            python3 usine/portes.py --nouvelles
          fi

      - name: Tableau de bord et brief du matin
        env:
          KB_MINUTES: ${{ runner.temp }}/nasdaq100_1min.csv.gz
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          PUBLIC: "1"
        run: |
          python3 usine/tableau.py
          python3 usine/brief.py

      - name: Sauvegarder les resultats de l'usine (pas l'etat du compte)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add usine/resultats usine/registre.csv usine/TABLEAU.md usine/tableau
          git diff --cached --quiet && exit 0
          git commit -m "Usine : portes et tableau de bord"
          for essai in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 10
          done
          exit 1
