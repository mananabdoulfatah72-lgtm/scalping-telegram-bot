name: Donnees gratuites VXN (Cboe, FRED, Yahoo)

# Sources gratuites sans cle. Lance par Claude en poussant donnees_libres/vxn/lancer.txt.

on:
  push:
    branches: [claude/affectionate-turing-tnz0mn]
    paths:
      - donnees_libres/vxn/lancer.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  telecharger:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Telecharger le VXN
        continue-on-error: true
        run: |
          pip install -q pandas requests yfinance
          python3 donnees_libres/vxn.py
      - name: Enregistrer sur la branche
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add donnees_libres/vxn 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Donnees gratuites : VXN au jour (Cboe, FRED, Yahoo)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 20))
          done
          exit 1
