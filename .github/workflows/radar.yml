name: Radar des marches (collecte 24 h sur 24, analyse, strategie)

on:
  schedule:   # n'agit que depuis la branche par defaut du depot (regle de GitHub)
    - cron: "20 22 * * 1-5"
    - cron: "20 3 * * 2-6"
    - cron: "20 12 * * 6"
  push:
    branches: [claude/optimistic-ptolemy-xs24ra]
    paths:
      - radar/collecte.py
      - radar/rapport.py
      - radar/enregistrer.sh
      - flux/veille.py
      - .github/workflows/radar.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency: radar

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dependances
        run: pip install yfinance pandas numpy requests xlrd openpyxl lxml

      - name: Collecter les marches (Yahoo), le gamma, Wikipedia, FRED, sentiment, options, resultats
        timeout-minutes: 40
        run: python3 radar/collecte.py
        env:
          RADAR_SOURCES: yahoo_jour,yahoo_heure,yahoo_minute,dix_gex,wiki,fred,incertitude,cnn,aaii,options_cboe,resultats

      - name: Enregistrer
        if: always()
        run: radar/enregistrer.sh "marches et sources"

      - name: Collecter le ton des nouvelles (GDELT)
        if: always()
        timeout-minutes: 15
        run: python3 radar/collecte.py
        env:
          RADAR_SOURCES: gdelt

      - name: Collecter les ventes a decouvert (FINRA, les plus recentes d'abord)
        if: always()
        timeout-minutes: 40
        run: python3 radar/collecte.py
        env:
          RADAR_SOURCES: finra

      - name: Enregistrer
        if: always()
        run: radar/enregistrer.sh "nouvelles et ventes a decouvert"

      - name: Completer l'historique FINRA (les plus anciennes, jusqu'a 2 500 jours par passage)
        if: always()
        timeout-minutes: 40
        run: python3 radar/collecte.py
        env:
          RADAR_SOURCES: finra
          RADAR_FINRA_ANCIENS: "1"

      - name: Suivi en direct des strategies candidates (flux/veille.py, sans argent)
        if: always()
        timeout-minutes: 20
        run: |
          pip install -q numba scipy
          git fetch -q --depth=1 origin main
          git show origin/main:zone/robot/nq_1min.csv.gz > "$RUNNER_TEMP/nq_robot.csv.gz"
          python3 flux/veille.py "$RUNNER_TEMP/nq_robot.csv.gz"
        env:
          DEBUT_SUIVI: "2026-10-30"
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}

      - name: Rapport du soir
        if: always() && hashFiles('radar/rapport.py') != ''
        run: python3 radar/rapport.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}

      - name: Enregistrer
        if: always()
        run: radar/enregistrer.sh "historique FINRA, suivi en direct et rapport"
