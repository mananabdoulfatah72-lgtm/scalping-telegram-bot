name: Radar des marches (collecte 24 h sur 24, analyse, strategie)

on:
  schedule:   # n'agit que depuis la branche par defaut du depot (regle de GitHub)
    - cron: "20 22 * * 1-5"
    - cron: "20 3 * * 2-6"
    - cron: "20 12 * * 6"
  push:
    branches: [claude/optimistic-ptolemy-xs24ra]
    paths:
      - radar/collecte.py
      - radar/rapport.py
      - .github/workflows/radar.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency: radar

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dependances
        run: pip install yfinance pandas numpy requests xlrd openpyxl lxml

      - name: Collecter les donnees de tous les marches et des autres sources
        run: python3 radar/collecte.py

      - name: Rapport du jour (si present)
        if: hashFiles('radar/rapport.py') != ''
        run: python3 radar/rapport.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}

      - name: Enregistrer les donnees sur la branche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radar/
          git diff --cached --quiet && exit 0
          git commit -q -m "Radar : donnees du $(date -u +%Y-%m-%d)"
          for essai in 1 2 3 4; do
            git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((10 * essai))
          done
          exit 1
