name: Robot zone de bruit + challenge 50K (argent virtuel)

on:
  schedule:   # GitHub saute parfois un passage : horaires de secours (le robot ne refait jamais un jour deja joue)
    - cron: "0 23 * * 1-5"
    - cron: "0 1 * * 2-6"
    - cron: "0 4 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write

concurrency: robot-tendance   # une seule file pour les robots : jamais deux envois sur main en meme temps

jobs:
  robot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dependances
        run: pip install databento pandas numpy requests

      - name: Lancer le robot
        run: python3 zone/robot.py
        env:
          ROBOT_DEBUT: "2026-09-25"   # premiere seance jouee : 28 septembre 2026
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}

      - name: Mettre a jour la page generale
        run: python3 tableau_general.py

      - name: Sauvegarder le compte virtuel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zone/robot/ README.md
          git diff --cached --quiet && exit 0
          git commit -m "Robots : mise a jour des comptes virtuels"
          for essai in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 10
          done
          exit 1
