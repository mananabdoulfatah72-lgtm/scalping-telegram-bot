name: Donnees sessions 24 h (HistData, 5 minutes)

on:
  push:
    branches: [claude/keen-babbage-r686cl]
    paths:
      - sessions24/telecharger_histdata.py
      - .github/workflows/donnees-sessions.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  telecharger:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Outils
        run: pip install pandas histdata
      - name: Telecharger et convertir
        continue-on-error: true
        run: python3 sessions24/telecharger_histdata.py
      - name: Enregistrer sur la branche
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sessions24/annees/*_5m.csv.gz
          git diff --cached --quiet && { echo "::error::aucune annee preparee"; exit 1; }
          git commit -m "Donnees sessions 24 h : HistData, barres de 5 minutes par annee"
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 20))
          done
          exit 1
