# Configuration de Jarvis. L'installateur la copie dans %APPDATA%\Jarvis\config.toml : c'est ce fichier-là qu'il
# faut modifier (il reste sur ton PC, jamais dans le dépôt). Redémarre Jarvis après un changement.
# Laisse vide ce que tu n'utilises pas : le module correspondant s'affiche « À CONFIG. » et le reste marche.

[general]
nom = "Jarvis"
proprietaire = ""                 # ton prénom (Jarvis se présente comme ton assistant)
personnalite = "majordome"        # majordome | neutre | concis | coach | pote
ville = "Paris"                   # ville de la météo par défaut
fuseau = "Europe/Paris"

[cerveau]
# Deux façons de faire penser Jarvis :
#  - "api" : clé de l'API Claude (console.anthropic.com > API keys). Le plus rapide. Payé à l'usage.
#  - "claude_code" : Claude Code installé et connecté à ton abonnement Claude. Pas de facture en plus.
#  - "auto" : la clé si elle est là, sinon Claude Code.
moteur = "auto"
cle_api = ""                      # ou variable d'environnement ANTHROPIC_API_KEY
modele = "claude-opus-5-5"        # autres choix : "claude-sonnet-5-5", "claude-haiku-5-5" (bien moins cher)
effort = "low"                    # low = réponses rapides ; medium ou high pour les tâches longues (réservations)
inactivite_minutes = 15           # nouvelle conversation après ce silence
modele_claude_code = ""           # vide = le modèle par défaut de Claude Code

[voix]
active = true
mot_reveil = "hey_jarvis"
seuil_reveil = 0.5                # plus haut = moins de faux réveils, plus bas = réagit plus facilement
modele_whisper = "small"          # base (rapide) | small (précis, conseillé) | medium (très précis, lent)
peripherique = "auto"             # auto (carte NVIDIA si elle marche, essayée une fois) | cuda | cpu
synthese = "auto"                 # auto | piper | windows | aucune
voix_piper = "fr_FR-tom-medium"
vitesse = 1.0
suivi_secondes = 6.0              # après une réponse, Jarvis écoute encore 6 s sans « Hey Jarvis »
silence_fin = 0.9                 # secondes de silence qui terminent ta phrase
micro = ""                        # vide = micro par défaut ; sinon un morceau de son nom, ex. "Realtek"

[interface]
port = 8765
ouvrir_navigateur = true
parler_reponses_clavier = true    # Jarvis dit aussi à voix haute les réponses aux messages tapés
reseau = false                    # true = cerveau visible depuis la télé ou le téléphone du wifi (avec la clé)
cle = ""                          # obligatoire si reseau = true : http://IP-du-PC:8765/?cle=TA_CLE

[pc]
commandes = true                  # commandes PowerShell autorisées (toujours avec confirmation)

[pc.applications]                 # tes raccourcis : nom parlé = commande ou chemin
# "mon jeu" = "steam://rungameid/730"
# "notion" = "C:\\Users\\moi\\AppData\\Local\\Programs\\Notion\\Notion.exe"

[hue]                             # rempli tout seul : dis « appaire les lumières » après avoir appuyé sur le pont
bridge = ""
utilisateur = ""

[obs]                             # OBS : Outils > Paramètres du serveur WebSocket
hote = "localhost"
port = 4455
mot_de_passe = ""

[discord]                         # un bot à toi, voir README
jeton = ""
utilisateur_id = ""               # ton identifiant Discord (mode développeur > clic droit sur toi > Copier l'identifiant)
salons = []                       # identifiants des salons à suivre ; vide = tous ceux que le bot voit

# [[instagram.comptes]]           # un bloc par compte (professionnel ou créateur), voir README
# nom = "principal"
# id = ""
# jeton = ""

[navigateur]
canal = "msedge"                  # msedge (déjà sur Windows) | chrome | "" (Chromium de Playwright)
sans_tete = false
cdp = ""                          # avancé : se brancher sur un Chrome lancé avec --remote-debugging-port

[twilio]                          # appels téléphoniques, voir README
sid = ""
jeton = ""
numero = ""                       # ton numéro Twilio, ex. "+33XXXXXXXXX"
url_publique = ""                 # pour les conversations : adresse ngrok ou cloudflared vers le port 8765
voix = "Polly.Lea"

[contacts]                        # noms parlés -> numéros (appels)
# maman = "+33612345678"
# garage = "0412345678"

[presence]                        # ton téléphone sur le wifi = tu es à la maison
ip_telephone = ""                 # adresse IP fixe du téléphone (réservation DHCP dans la box)
intervalle = 30
# actions à l'arrivée et au départ :
# arrivee = [{ outil = "hue_scene", arguments = { scene = "Détente" } }, { dire = "Bon retour, monsieur." }]
# depart = [{ outil = "hue_regler", arguments = { cible = "tout", allumer = false } }]

[ntfy]                            # notifications sur le téléphone (application gratuite ntfy)
sujet = ""                        # un nom secret et long, ex. "jarvis-manan-8f3k2"
serveur = "https://ntfy.sh"

[telegram]                        # Jarvis sur ton téléphone partout (bot créé avec @BotFather)
jeton = ""
chat_id = ""                      # envoie un message à ton bot : il te répond ton numéro
