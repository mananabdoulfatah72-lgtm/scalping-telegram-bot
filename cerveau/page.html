<title>Second Cerveau</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* Un seul monde : un cerveau de neurones dans le noir. Scène plein écran ; en haut à gauche l'identité et les aires ;
   à droite (en bas sur téléphone) la conversation. */
:root {
  color-scheme: dark;
  --nuit: #04050b; --verre: rgba(12, 15, 28, .78); --verre-fort: rgba(16, 20, 36, .92); --bord: rgba(150, 170, 255, .16);
  --texte: #e9edf7; --texte-2: #a6aec4; --texte-3: #6f7891; --signal: #8fb4ff; --chaud: #ffc65c;
  --f-titre: "Unbounded", "Segoe UI", system-ui, sans-serif;
  --f-texte: "IBM Plex Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --f-chiffre: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
html { background: var(--nuit); }
body { background: radial-gradient(1200px 800px at 40% 45%, #0d1230 0%, #070916 45%, var(--nuit) 100%); color: var(--texte); font-family: var(--f-texte); font-size: 15px; line-height: 1.5; overflow: hidden; }
#scene { position: fixed; inset: 0; touch-action: none; }
#scene canvas { display: block; width: 100%; height: 100%; }
.etiquettes { position: fixed; inset: 0; pointer-events: none; }
.etiq { position: absolute; transform: translate(-50%, -150%); font: 500 .72rem var(--f-texte); color: var(--texte); background: rgba(6, 8, 18, .72); border: 1px solid var(--bord); border-radius: 999px; padding: 2px 9px; white-space: nowrap; max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
.etiq i { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }

/* Identité */
.identite { position: fixed; left: max(18px, env(safe-area-inset-left, 0px)); top: calc(env(safe-area-inset-top, 0px) + 16px); max-width: 360px; display: grid; gap: 10px; pointer-events: none; }
.identite > * { pointer-events: auto; }
.identite h1 { font-family: var(--f-titre); font-weight: 700; font-size: clamp(1.4rem, 3vw, 2.1rem); letter-spacing: .02em; margin: 0; line-height: 1.05; }
.identite h1 span { color: var(--chaud); }
.compte { font-family: var(--f-chiffre); font-size: .72rem; color: var(--texte-2); letter-spacing: .06em; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.compte b { color: var(--texte); font-weight: 500; }
.aires { display: flex; flex-wrap: wrap; gap: 6px; }
.aire { font: 500 .72rem var(--f-texte); color: var(--texte-2); background: rgba(8, 10, 22, .6); border: 1px solid var(--bord); border-radius: 999px; padding: 3px 10px 3px 7px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.aire i { width: 8px; height: 8px; border-radius: 50%; }
.aire[aria-pressed="true"] { color: var(--texte); border-color: rgba(255, 255, 255, .45); }
.aire small { color: var(--texte-3); font-family: var(--f-chiffre); }
.etat { font-family: var(--f-chiffre); font-size: .7rem; color: var(--texte-3); display: inline-flex; gap: 6px; align-items: center; }
.etat i { width: 7px; height: 7px; border-radius: 50%; background: var(--texte-3); }
.etat.ok i { background: #6ee7a0; box-shadow: 0 0 8px #6ee7a0; }
.etat.local i { background: var(--chaud); }

/* Conversation */
.panneau { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(env(safe-area-inset-top, 0px) + 16px); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); width: min(420px, 38vw); display: flex; flex-direction: column; background: var(--verre); border: 1px solid var(--bord); border-radius: 18px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); overflow: hidden; }
.panneau header { padding: 14px 16px 10px; display: flex; justify-content: space-between; align-items: center; gap: 10px; border-bottom: 1px solid var(--bord); }
.panneau header h2 { margin: 0; font: 600 .95rem var(--f-texte); letter-spacing: .02em; }
.poignee { display: none; }
.options { display: flex; gap: 6px; flex-wrap: wrap; }
.bascule { font: 500 .72rem var(--f-texte); color: var(--texte-2); background: transparent; border: 1px solid var(--bord); border-radius: 999px; padding: 4px 10px; cursor: pointer; }
.bascule[aria-pressed="true"] { color: #0a0c18; background: var(--texte); border-color: var(--texte); }
.fil { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
.msg { max-width: 100%; font-size: .9rem; line-height: 1.55; overflow-wrap: anywhere; }
.msg.moi { align-self: flex-end; background: rgba(143, 180, 255, .14); border: 1px solid rgba(143, 180, 255, .25); border-radius: 14px 14px 4px 14px; padding: 8px 12px; max-width: 88%; }
.msg.lui { align-self: stretch; }
.msg.lui .qui { font-family: var(--f-chiffre); font-size: .66rem; color: var(--texte-3); letter-spacing: .1em; text-transform: uppercase; margin-bottom: 3px; display: flex; gap: 8px; align-items: center; }
.msg.lui .qui i { width: 6px; height: 6px; border-radius: 50%; background: var(--signal); box-shadow: 0 0 6px var(--signal); }
.msg.lui p { margin: 0 0 8px; }
.msg.lui ul { margin: 0 0 8px; padding-left: 18px; }
.cite { display: inline-flex; align-items: center; gap: 4px; font: 500 .7rem var(--f-texte); color: var(--texte); background: rgba(255, 255, 255, .07); border: 1px solid var(--bord); border-radius: 999px; padding: 0 7px; margin: 0 1px; cursor: pointer; vertical-align: 1px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cite i { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.reflexion { color: var(--texte-3); font-family: var(--f-chiffre); font-size: .78rem; }
.reflexion::after { content: "…"; animation: points 1.2s infinite steps(4); display: inline-block; width: 1.2em; overflow: hidden; vertical-align: bottom; }
@keyframes points { from { width: 0; } to { width: 1.2em; } }
.idees { display: flex; flex-wrap: wrap; gap: 6px; }
.idee { font: 500 .78rem var(--f-texte); color: var(--texte); background: rgba(255, 255, 255, .05); border: 1px solid var(--bord); border-radius: 999px; padding: 5px 11px; cursor: pointer; text-align: left; }
.idee:hover { background: rgba(255, 255, 255, .1); }
.note-sys { font-size: .74rem; color: var(--texte-3); }
.saisie { border-top: 1px solid var(--bord); padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px) * 0); display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: end; }
.saisie textarea { resize: none; font: 400 .92rem var(--f-texte); color: var(--texte); background: rgba(0, 0, 0, .3); border: 1px solid var(--bord); border-radius: 12px; padding: 10px 12px; min-height: 44px; max-height: 140px; outline: none; }
.saisie textarea:focus { border-color: rgba(143, 180, 255, .6); }
.envoyer { width: 44px; height: 44px; border-radius: 12px; border: 0; background: var(--chaud); color: #120d00; font: 700 1.1rem var(--f-texte); cursor: pointer; }
.envoyer.stop { background: #ff7a7a; }
.envoyer:disabled { opacity: .45; cursor: default; }
.astuce { grid-column: 1 / -1; font-size: .7rem; color: var(--texte-3); }
.micro { width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(110, 231, 160, .55); background: radial-gradient(circle at 50% 38%, rgba(110, 231, 160, .38), rgba(110, 231, 160, .08)); color: var(--texte); cursor: pointer; display: grid; place-items: center; box-shadow: 0 0 14px rgba(110, 231, 160, .25); }
.micro svg { width: 20px; height: 20px; }
button:focus-visible, textarea:focus-visible { outline: 2px solid var(--chaud); outline-offset: 2px; }

/* Fiche d'un neurone */
.fiche { position: fixed; left: max(18px, env(safe-area-inset-left, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); width: min(380px, calc(100vw - 36px)); background: var(--verre-fort); border: 1px solid var(--bord); border-radius: 16px; padding: 14px 16px; display: grid; gap: 8px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); max-height: 45vh; overflow: auto; }
.fiche[hidden] { display: none; }
.fiche .cat { font-family: var(--f-chiffre); font-size: .68rem; letter-spacing: .08em; text-transform: uppercase; display: flex; gap: 6px; align-items: center; }
.fiche .cat i { width: 8px; height: 8px; border-radius: 50%; }
.fiche h3 { margin: 0; font: 600 1rem var(--f-texte); }
.fiche p { margin: 0; font-size: .84rem; color: var(--texte-2); }
.fiche .actions { display: flex; gap: 8px; flex-wrap: wrap; }
.fiche button { font: 500 .78rem var(--f-texte); color: var(--texte); background: rgba(255, 255, 255, .06); border: 1px solid var(--bord); border-radius: 999px; padding: 5px 12px; cursor: pointer; }
.indice { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); font-family: var(--f-chiffre); font-size: .68rem; color: var(--texte-3); pointer-events: none; white-space: nowrap; }

@media (max-width: 760px) {
  .panneau { left: 10px; right: 10px; width: auto; top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); height: 52vh; border-radius: 18px; transition: height .25s ease; }
  .panneau.replie { height: 112px; }
  .poignee { display: block; width: 44px; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, .25); border: 0; margin: 8px auto 0; cursor: pointer; padding: 0; }
  .identite { max-width: calc(100vw - 36px); gap: 8px; }
  .aires { display: none; }
  .identite.ouvre .aires { display: flex; }
  .fiche { bottom: calc(52vh + 22px); }
  .indice { display: none; }
}
/* Appel : on se parle à voix haute, le cerveau au centre */
.appel { position: fixed; left: 18px; right: calc(min(420px, 38vw) + 34px); bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none; }
.appel[hidden] { display: none; }
.appel > * { pointer-events: auto; }
.a-sous { max-width: 640px; min-height: 4.8em; display: flex; align-items: flex-end; justify-content: center; text-align: center; font: 500 1.06rem/1.55 var(--f-texte); color: var(--texte); text-shadow: 0 1px 14px #000, 0 0 3px #000; pointer-events: none; }
.a-sous span { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.a-sous.moi { color: var(--signal); font-style: italic; }
.a-note { margin: 0; max-width: 560px; font-size: .76rem; color: var(--texte-2); text-align: center; background: rgba(6, 8, 18, .78); border: 1px solid var(--bord); border-radius: 10px; padding: 6px 10px; }
.a-note[hidden], .a-dictee[hidden], .a-voix[hidden] { display: none; }
.a-dictee { width: min(560px, 100%); resize: none; font: 400 .95rem var(--f-texte); color: var(--texte); background: var(--verre-fort); border: 1px solid rgba(143, 180, 255, .55); border-radius: 14px; padding: 10px 12px; min-height: 48px; outline: none; }
.a-barre { display: flex; align-items: center; gap: 14px; max-width: 100%; background: var(--verre-fort); border: 1px solid var(--bord); border-radius: 999px; padding: 8px 10px 8px 8px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
.orbe { flex: none; width: 64px; height: 64px; border-radius: 50%; border: 0; cursor: pointer; position: relative; color: #0a0c18; display: grid; place-items: center; background: radial-gradient(circle at 50% 36%, rgba(255, 255, 255, .55), transparent 62%), var(--o, #8fb4ff); box-shadow: 0 0 26px var(--o, #8fb4ff); transition: background-color .3s, box-shadow .3s; }
.orbe svg { width: 26px; height: 26px; }
.orbe::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 2px solid var(--o, #8fb4ff); opacity: .6; animation: onde 1.6s ease-out infinite; }
.appel[data-etat="ecoute"] .orbe { --o: #6ee7a0; }
.appel[data-etat="reflexion"] .orbe { --o: #b58cff; }
.appel[data-etat="reflexion"] .orbe::after { border-style: dashed; animation: tourne 1.1s linear infinite; }
.appel[data-etat="parle"] .orbe { --o: #ffc65c; }
.appel[data-etat="parle"] .orbe::after { animation-duration: .75s; }
.appel[data-etat="pause"] .orbe::after { animation: none; opacity: .25; }
@keyframes onde { from { transform: scale(1); opacity: .7; } to { transform: scale(1.38); opacity: 0; } }
@keyframes tourne { to { transform: rotate(360deg); } }
.a-texte { display: grid; gap: 3px; min-width: 0; }
.a-etat { font: 600 .88rem/1.25 var(--f-texte); }
.a-voix { font: 400 .72rem var(--f-texte); color: var(--texte-2); background: rgba(0, 0, 0, .35); border: 1px solid var(--bord); border-radius: 8px; padding: 2px 4px; max-width: 200px; }
.a-fin { flex: none; font: 600 .8rem var(--f-texte); color: #fff; background: #d9485f; border: 0; border-radius: 999px; padding: 10px 14px; cursor: pointer; }
.en-appel .indice { display: none; }
.en-appel .fiche { bottom: calc(env(safe-area-inset-bottom, 0px) + 200px); max-height: 38vh; }
@media (max-width: 760px) {
  .en-appel .panneau { display: none; }
  .appel { left: 10px; right: 10px; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); }
  .a-sous { font-size: 1rem; }
  .a-barre { gap: 10px; }
  .a-voix { max-width: 130px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
</style>

<div id="scene" aria-label="Cerveau en trois dimensions : chaque point est une note de ta recherche"></div>
<div class="etiquettes" id="etiquettes" aria-hidden="true"></div>

<div class="identite" id="identite">
  <h1>Second <span>cerveau</span></h1>
  <div class="compte" id="compte"></div>
  <div class="aires" id="aires" role="group" aria-label="Aires du cerveau"></div>
  <span class="etat" id="etat"><i></i><span>Connexion à Claude…</span></span>
</div>

<section class="panneau" id="panneau" aria-label="Conversation avec le cerveau">
  <button class="poignee" id="poignee" type="button" aria-label="Agrandir ou réduire la conversation"></button>
  <header>
    <h2>Pose ta question</h2>
    <div class="options">
      <button class="bascule" id="o-profond" type="button" aria-pressed="false" title="Réponses plus réfléchies, plus lentes">Approfondi</button>
      <button class="bascule" id="o-voix" type="button" aria-pressed="false" title="Le cerveau lit ses réponses à voix haute">Voix</button>
      <button class="bascule" id="o-effacer" type="button" title="Effacer la conversation (les souvenirs restent)">Effacer</button>
    </div>
  </header>
  <div class="fil" id="fil" aria-live="polite"></div>
  <form class="saisie" id="saisie">
    <textarea id="question" rows="1" placeholder="Demande-moi quelque chose… ou « retiens que … »" aria-label="Ta question"></textarea>
    <button class="micro" id="parler" type="button" aria-label="Se parler à voix haute" title="Se parler à voix haute"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <button class="envoyer" id="envoyer" type="submit" aria-label="Envoyer">➤</button>

  </form>
</section>

<aside class="fiche" id="fiche" hidden></aside>

<section class="appel" id="appel" hidden data-etat="off" aria-label="Appel vocal avec le cerveau">
  <div class="a-sous" id="a-sous" aria-live="polite"><span></span></div>
  <p class="a-note" id="a-note" hidden></p>
  <textarea class="a-dictee" id="a-dictee" rows="1" hidden placeholder="Touche le micro de ton clavier et parle…" aria-label="Ce que tu dis"></textarea>
  <div class="a-barre">
    <button class="orbe" id="a-orbe" type="button" aria-label="Parler"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <div class="a-texte"><span class="a-etat" id="a-etat">Je t'écoute…</span><select class="a-voix" id="a-voix" aria-label="Voix du cerveau" hidden></select></div>
    <button class="a-fin" id="a-fin" type="button">Raccrocher</button>
  </div>
</section>
<div class="indice">Glisse pour tourner · molette pour zoomer · clique un neurone</div>

<script id="savoir" type="application/json">/*SAVOIR*/</script>
<script>
(() => {
"use strict";
const S = JSON.parse(document.getElementById("savoir").textContent);
const CATS = S.cats;
const notes = S.notes.map((n, i) => Object.assign({}, n, {id: "n" + i, i}));
const liens = S.liens.slice();
const reduit = matchMedia("(prefers-reduced-motion: reduce)").matches;
const $ = id => document.getElementById(id);

/* ================= recherche (BM25, sans accents) ================= */
const VIDES = new Set("le la les un une des du de d l a au aux et ou en est sont pas plus pour par sur sous avec sans que qui quoi dans ce cette ces son sa ses leur leurs il elle ils elles on nous vous je tu se ne y si mais donc car comme tout tous toute toutes fait faire etre avoir ete deja aussi tres bien peu entre apres avant chaque meme ainsi alors quel quelle quels quelles est-ce mon ma mes ton ta tes moi toi combien comment pourquoi quand the of and to in is for".split(" "));
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const mots = s => (norm(s).match(/[a-z0-9]+/g) || []).filter(m => m.length > 2 && !VIDES.has(m)).map(m => m.length > 5 ? m.replace(/(ement|ements|ations|ation|ions|ion|es|s|e)$/, "") : m);
let index = null;
function indexer() {
  const docs = notes.map(n => { const t = mots(n.t + " " + n.t + " " + n.x), c = new Map(); for (const m of t) c.set(m, (c.get(m) || 0) + 1); return {c, len: t.length}; });
  const df = new Map(); for (const d of docs) for (const m of d.c.keys()) df.set(m, (df.get(m) || 0) + 1);
  const moy = docs.reduce((a, d) => a + d.len, 0) / docs.length;
  index = {docs, df, moy};
}
function chercher(q, k = 8) {
  if (!index || index.docs.length !== notes.length) indexer();
  const qm = [...new Set(mots(q))], N = notes.length, res = [];
  index.docs.forEach((d, i) => {
    let s = 0;
    for (const m of qm) { const f = d.c.get(m); if (!f) continue; const idf = Math.log(1 + (N - index.df.get(m) + .5) / (index.df.get(m) + .5)); s += idf * f * 2.2 / (f + 1.2 * (.25 + .75 * d.len / index.moy)); }
    if (notes[i].d === "cœur") s *= 1.35;
    if (notes[i].c === "souvenir") s *= 1.25;
    if (s > 0) res.push({i, s});
  });
  return res.sort((a, b) => b.s - a.s).slice(0, k);
}

/* ================= le cerveau en 3D ================= */
let ren, scene, cam, groupe, ptsGeo, ptsMat, liensGeo, poussiere, impGeo; const MATS = [];
const POS = [], COLS = [], TAILLE = [], ECLAT = [], EPINGLE = [];
const PULSES = [], NP = 220;
let vue = {az: -0.8, el: 0.42, zoom: 1, dist: 5.4, touche: 0, cx: 0, cy: 0, but: {dist: 5.4, cx: 0, cy: 0}}, filtreCat = null, enReflexion = false, activite = 0;
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const gauss = r => { let u = 0, v = 0; while (!u) u = r(); while (!v) v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
// aires : lobe préfrontal = tes objectifs, cortex moteur = le bot, lobes temporaux = les données, arrière = la recherche, hippocampe = les souvenirs
const AIRES = {toi: [[0, .45, .78]], bot: [[0, .66, .05]], robustesse: [[.55, .18, .55]], prop: [[-.55, .18, .55]], recherche: [[0, .12, -.72]], flux: [[.78, -.28, .02], [-.78, -.28, .02]], souvenir: [[0, -.22, .06]]};
const SIG = {recherche: .42, toi: .2, souvenir: .18};
const ECH = [1.12, .9, 1.42];
function versCerveau(p) {
  let [x, y, z] = p;
  const r = Math.sqrt(x * x + y * y + z * z); if (r > .97) { x *= .97 / r; y *= .97 / r; z *= .97 / r; }
  x = Math.sign(x || 1) * (Math.abs(x) * .86 + .11) * (1 - .1 * z);            // deux hémisphères séparés par la scissure, plus larges à l'arrière
  // dessous : le lobe frontal reste haut, le lobe temporal descend sur les côtés, l'occipital laisse la place au cervelet
  const temporal = Math.exp(-(((z - .05) / .42) ** 2)) * Math.min(1, Math.abs(x) / .5), arriere = Math.max(0, -z - .35) / .6;
  const fond = -.2 - .34 * temporal + .1 * Math.min(1, arriere);
  if (y < fond) y = fond + (y - fond) * .35;
  if (y > .35) y = .35 + (y - .35) * .9;                                         // dessus un peu plus plat
  return [x * ECH[0], y * ECH[1], z * ECH[2]];
}

for (const id of ["o-profond", "o-voix"]) $(id).onclick = () => { const b = $(id); b.setAttribute("aria-pressed", String(b.getAttribute("aria-pressed") !== "true")); if (id === "o-voix" && b.getAttribute("aria-pressed") !== "true" && !appel.actif) taire(); };
$("o-effacer").onclick = () => { if (ctl) ctl.abort(); TOURS.length = 0; fil.innerHTML = ""; accueil(); sauverFil(); epinglesReponse = []; EPINGLE.fill(0); };
$("poignee").onclick = () => $("panneau").classList.toggle("replie");
$("identite").addEventListener("click", e => { if (innerWidth < 760 && e.target.closest("h1")) $("identite").classList.toggle("ouvre"); });
if (!("speechSynthesis" in window)) $("o-voix").hidden = true;
$("parler").onclick = demarrerAppel;
$("a-orbe").onclick = toucherOrbe;
$("a-fin").onclick = finAppel;
$("a-voix").onchange = () => { garderLocal("cerveau-voix", $("a-voix").value); if (appel.etat === "ecoute" || appel.etat === "pause" || appel.etat === "dictee") { arreterEcoute(); taire(); etatAppel(appel.dictee ? "dictee" : "parle"); dire("Voilà ma nouvelle voix."); } };
$("a-dictee").addEventListener("input", () => { clearTimeout(minuteurDictee); if ($("a-dictee").value.trim()) minuteurDictee = setTimeout(envoyerDictee, 1700); });
$("a-dictee").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); envoyerDictee(); } });
addEventListener("keydown", e => { if (e.key === "Escape" && appel.actif) finAppel(); });
if ("speechSynthesis" in window) { speechSynthesis.getVoices(); speechSynthesis.addEventListener?.("voiceschanged", remplirVoix); }
(async () => {
  if (!window.claude || typeof claude.use !== "function") { etat("local"); return; }
  const [s] = await Promise.all([claude.use("sample"), brancherMemoire()]);
  sample = s;
  if (!sample) { etat("local"); return; }
  const lim = await sample.limits().catch(() => null);
  outilsOk = !!(lim && lim.tools);
  etat("ok");
})();
})();
