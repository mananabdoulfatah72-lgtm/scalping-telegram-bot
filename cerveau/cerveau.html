<title>Second Cerveau</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* Un cerveau seul dans le noir. On lui parle, il répond à voix haute ; sous lui, les sous-titres et son état.
   La conversation écrite se range à droite (en bas sur téléphone) et ne sort que si on la demande. */
:root {
  color-scheme: dark;
  --nuit: #04050b; --verre: rgba(12, 15, 28, .8); --verre-fort: rgba(16, 20, 36, .92); --bord: rgba(150, 170, 255, .16);
  --texte: #e9edf7; --texte-2: #a6aec4; --texte-3: #6f7891; --signal: #8fb4ff; --chaud: #ffc65c;
  --f-titre: "Unbounded", "Segoe UI", system-ui, sans-serif;
  --f-texte: "IBM Plex Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --f-chiffre: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
html { background: var(--nuit); }
body { background: radial-gradient(1200px 800px at 50% 42%, #0d1230 0%, #070916 45%, var(--nuit) 100%); color: var(--texte); font-family: var(--f-texte); font-size: 15px; line-height: 1.5; overflow: hidden; }
#scene { position: fixed; inset: 0; touch-action: none; }
#scene canvas { display: block; width: 100%; height: 100%; }
.etiquettes { position: fixed; inset: 0; pointer-events: none; }
.etiq { position: absolute; transform: translate(-50%, -150%); font: 500 .72rem var(--f-texte); color: var(--texte); background: rgba(6, 8, 18, .72); border: 1px solid var(--bord); border-radius: 999px; padding: 2px 9px; white-space: nowrap; max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
.etiq i { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }

/* Coin : deux boutons ronds, rien d'autre */
.coin { position: fixed; z-index: 3; top: calc(env(safe-area-inset-top, 0px) + 14px); right: max(14px, env(safe-area-inset-right, 0px)); display: flex; gap: 8px; }
.rond { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--bord); background: rgba(8, 10, 22, .55); color: var(--texte-2); display: grid; place-items: center; cursor: pointer; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.rond svg { width: 19px; height: 19px; }
.rond:hover { color: var(--texte); border-color: rgba(255, 255, 255, .35); }
.rond .barre { display: none; }
#b-micro.coupe { color: #ff8a8a; border-color: rgba(255, 138, 138, .5); }
#b-micro.coupe .barre { display: inline; }
#b-texte[aria-pressed="true"] { color: #0a0c18; background: var(--texte); border-color: var(--texte); }

/* Conversation écrite (cachée par défaut) */
.panneau { position: fixed; z-index: 2; right: max(14px, env(safe-area-inset-right, 0px)); top: calc(env(safe-area-inset-top, 0px) + 66px); bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); width: min(400px, 36vw); display: flex; flex-direction: column; background: var(--verre); border: 1px solid var(--bord); border-radius: 18px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); overflow: hidden; transition: transform .3s ease, opacity .3s ease; }
.panneau.ferme { transform: translateX(calc(100% + 30px)); opacity: 0; pointer-events: none; }
.panneau header { padding: 12px 14px 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; border-bottom: 1px solid var(--bord); }
.panneau header h2 { margin: 0; font: 600 .95rem var(--f-texte); }
.options { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; justify-content: flex-end; }
.bascule { font: 500 .72rem var(--f-texte); color: var(--texte-2); background: transparent; border: 1px solid var(--bord); border-radius: 999px; padding: 4px 10px; cursor: pointer; }
.bascule[aria-pressed="true"] { color: #0a0c18; background: var(--texte); border-color: var(--texte); }
.choix-voix { font: 400 .72rem var(--f-texte); color: var(--texte-2); background: rgba(0, 0, 0, .35); border: 1px solid var(--bord); border-radius: 999px; padding: 3px 6px; max-width: 150px; }
.choix-voix[hidden] { display: none; }
.etat-txt { margin: 0; padding: 6px 16px; font-family: var(--f-chiffre); font-size: .68rem; color: var(--texte-3); border-bottom: 1px solid var(--bord); }
.fil { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
.msg { max-width: 100%; font-size: .9rem; line-height: 1.55; overflow-wrap: anywhere; }
.msg.moi { align-self: flex-end; background: rgba(143, 180, 255, .14); border: 1px solid rgba(143, 180, 255, .25); border-radius: 14px 14px 4px 14px; padding: 8px 12px; max-width: 88%; }
.msg.lui { align-self: stretch; }
.msg.lui .qui { font-family: var(--f-chiffre); font-size: .66rem; color: var(--texte-3); letter-spacing: .1em; text-transform: uppercase; margin-bottom: 3px; display: flex; gap: 8px; align-items: center; }
.msg.lui .qui i { width: 6px; height: 6px; border-radius: 50%; background: var(--signal); box-shadow: 0 0 6px var(--signal); }
.msg.lui p { margin: 0 0 8px; }
.msg.lui ul { margin: 0 0 8px; padding-left: 18px; }
.cite { display: inline-flex; align-items: center; gap: 4px; font: 500 .7rem var(--f-texte); color: var(--texte); background: rgba(255, 255, 255, .07); border: 1px solid var(--bord); border-radius: 999px; padding: 0 7px; margin: 0 1px; cursor: pointer; vertical-align: 1px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cite i { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.reflexion { color: var(--texte-3); font-family: var(--f-chiffre); font-size: .78rem; }
.reflexion::after { content: "…"; animation: points 1.2s infinite steps(4); display: inline-block; width: 1.2em; overflow: hidden; vertical-align: bottom; }
@keyframes points { from { width: 0; } to { width: 1.2em; } }
.idees { display: flex; flex-wrap: wrap; gap: 6px; }
.idee { font: 500 .78rem var(--f-texte); color: var(--texte); background: rgba(255, 255, 255, .05); border: 1px solid var(--bord); border-radius: 999px; padding: 5px 11px; cursor: pointer; text-align: left; }
.idee:hover { background: rgba(255, 255, 255, .1); }
.note-sys { font-size: .74rem; color: var(--texte-3); }
.saisie { border-top: 1px solid var(--bord); padding: 10px 12px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: end; }
.saisie textarea { resize: none; font: 400 .92rem var(--f-texte); color: var(--texte); background: rgba(0, 0, 0, .3); border: 1px solid var(--bord); border-radius: 12px; padding: 10px 12px; min-height: 44px; max-height: 140px; outline: none; }
.saisie textarea:focus { border-color: rgba(143, 180, 255, .6); }
.envoyer { width: 44px; height: 44px; border-radius: 12px; border: 0; background: var(--chaud); color: #120d00; font: 700 1.1rem var(--f-texte); cursor: pointer; }
.envoyer.stop { background: #ff7a7a; }
button:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--chaud); outline-offset: 2px; }

/* Fiche d'un neurone (quand on en touche un) */
.fiche { position: fixed; z-index: 2; left: max(14px, env(safe-area-inset-left, 0px)); top: calc(env(safe-area-inset-top, 0px) + 14px); width: min(380px, calc(100vw - 28px)); background: var(--verre-fort); border: 1px solid var(--bord); border-radius: 16px; padding: 14px 16px; display: grid; gap: 8px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); max-height: 46vh; overflow: auto; }
.fiche[hidden] { display: none; }
.fiche .cat { font-family: var(--f-chiffre); font-size: .68rem; letter-spacing: .08em; text-transform: uppercase; display: flex; gap: 6px; align-items: center; }
.fiche .cat i { width: 8px; height: 8px; border-radius: 50%; }
.fiche h3 { margin: 0; font: 600 1rem var(--f-texte); }
.fiche p { margin: 0; font-size: .84rem; color: var(--texte-2); }
.fiche .actions { display: flex; gap: 8px; flex-wrap: wrap; }
.fiche button { font: 500 .78rem var(--f-texte); color: var(--texte); background: rgba(255, 255, 255, .06); border: 1px solid var(--bord); border-radius: 999px; padding: 5px 12px; cursor: pointer; }

/* La voix : sous-titres et pastille d'état, sous le cerveau */
.voix { position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); display: flex; flex-direction: column; align-items: center; gap: 12px; pointer-events: none; transition: right .3s ease; }
.voix > * { pointer-events: auto; }
.avec-texte .voix { right: calc(min(400px, 36vw) + 28px); }
.sous { max-width: 760px; min-height: 4.8em; display: flex; align-items: flex-end; justify-content: center; text-align: center; font: 500 1.12rem/1.55 var(--f-texte); color: var(--texte); text-shadow: 0 1px 14px #000, 0 0 3px #000; pointer-events: none; }
.sous span { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.sous.moi { color: var(--signal); font-style: italic; }
.a-note { margin: 0; max-width: 560px; font-size: .76rem; color: var(--texte-2); text-align: center; background: rgba(6, 8, 18, .78); border: 1px solid var(--bord); border-radius: 10px; padding: 6px 10px; }
.a-note[hidden], .a-dictee[hidden] { display: none; }
.a-dictee { width: min(560px, 100%); resize: none; font: 400 .95rem var(--f-texte); color: var(--texte); background: var(--verre-fort); border: 1px solid rgba(143, 180, 255, .55); border-radius: 14px; padding: 10px 12px; min-height: 48px; outline: none; }
.pastille { display: inline-flex; align-items: center; gap: 10px; font: 600 .86rem var(--f-texte); color: var(--texte); background: rgba(8, 10, 22, .6); border: 1px solid var(--bord); border-radius: 999px; padding: 9px 16px 9px 13px; cursor: pointer; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.pastille i { width: 10px; height: 10px; border-radius: 50%; background: var(--c, #8fb4ff); box-shadow: 0 0 10px var(--c, #8fb4ff); animation: battement 1.6s ease-in-out infinite; }
.voix[data-etat="veille"] .pastille { animation: appel 2.4s ease-in-out infinite; }
.voix[data-etat="ecoute"] .pastille { --c: #6ee7a0; }
.voix[data-etat="reflexion"] .pastille { --c: #b58cff; }
.voix[data-etat="reflexion"] .pastille i { animation-duration: .6s; }
.voix[data-etat="parle"] .pastille { --c: #ffc65c; }
.voix[data-etat="parle"] .pastille i { animation-duration: .45s; }
.voix[data-etat="pause"] .pastille { --c: #7a8199; color: var(--texte-2); }
.voix[data-etat="pause"] .pastille i { animation: none; }
@keyframes battement { 0%, 100% { transform: scale(1); opacity: .75; } 50% { transform: scale(1.45); opacity: 1; } }
@keyframes appel { 0%, 100% { box-shadow: 0 0 0 0 rgba(143, 180, 255, 0); } 50% { box-shadow: 0 0 0 9px rgba(143, 180, 255, .13); } }

@media (max-width: 760px) {
  .panneau { left: 10px; right: 10px; width: auto; top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); height: 62vh; }
  .panneau.ferme { transform: translateY(calc(100% + 30px)); }
  .avec-texte .voix { display: none; }
  .sous { font-size: 1.02rem; }
  .fiche { max-height: 40vh; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
</style>

  <button class="rond" id="b-micro" type="button" aria-pressed="false" aria-label="Allumer mon écoute" title="Allumer ou couper mon écoute"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/><path class="barre" d="M4 4l16 16"/></svg></button>
  <button class="rond" id="b-texte" type="button" aria-pressed="false" aria-label="Voir la conversation écrite" title="Voir la conversation écrite"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1.1-4.4A8 8 0 1 1 21 12z"/></svg></button>

<section class="panneau ferme" id="panneau" aria-label="Conversation écrite">
  <header>

</section>

<script id="savoir" type="application/json">{"cats":{"bot":{"nom":"Le bot","couleur":"#ffc65c"},"recherche":{"nom":"Recherche et tournois","couleur":"#5aa8ff"},"prop":{"nom":"Prop firms et comptes","couleur":"#ff6fa8"},"robustesse":{"nom":"Robustesse et Monte Carlo","couleur":"#7be08a"},"flux":{"nom":"Order flow et données","couleur":"#4fe3e0"},"toi":{"nom":"Toi, tes objectifs, tes règles","couleur":"#b58cff"},"souvenir":{"nom":"Souvenirs","couleur":"#ffffff"}},"notes":[{"t":"Le bot 3 en 1","x":"Bot de futures sur le Nasdaq, codé en C# pour Quantower (compte Rithmic). Trois morceaux : la zone de bruit sur 1 MNQ, filtrée par le delta des 30 dernières minutes, et le RSI(2) de nuit sur 1 MES. Le « mode à plat » ferme tout à 16 h (New York) pour les comptes qui l'exigent comme Bulenox. Réglages Bulenox : frein 750 $, plafond 500 $/jour sur le Master, limite de perte du jour 1 050 $, pas de zone les jours de la Fed.","c":"bot","d":"cœur"},{"t":"Zone de bruit","x":"Stratégie publiée par Zarattini, Aziz et Barbon (2024), paramètres de l'article. Toutes les 30 minutes de 10 h à 15 h 30 (New York), achat si le prix casse au-dessus de max(ouverture, veille) × (1 + mouvement moyen des 14 jours à cette heure), vente sous le bas symétrique. Sortie quand le prix repasse la zone ou le VWAP. Elle gagne moins d'un jour sur deux (46-49 %) mais gagne gros : +335 à +344 $ en moyenne les jours gagnants contre −165 à −190 $ les jours perdants. Elle porte 89 % du risque du bot.","c":"bot","d":"cœur"},{"t":"Filtre delta 30 minutes","x":"Au signal de la zone, on regarde le delta (achats agressifs − ventes agressives) des 30 dernières minutes : s'il va contre le trade, on ne le prend pas. Avril-septembre 2026 : 99 trades, 20 écartés à −39,7 points en moyenne. Coffre août-octobre 2026 : 18 gardés à +67,4 points, 5 écartés à −35,2 points, t = 2,34. Sur 15 ans, une approximation gratuite ne le confirme pas (t = 1,62). S'il est réel, le Sharpe passe de 1,33 à 2,04. C'est la plus grosse inconnue : seulement 20 trades écartés.","c":"bot","d":"cœur"},{"t":"RSI(2) de nuit","x":"Règle de Connors et Alvarez (2008) : à 15 h 50, achat si la clôture est au-dessus de la moyenne des 200 et le RSI(2) sous 10 ; vente quand la clôture passe au-dessus de la moyenne des 5. Version de nuit : 1 MES acheté à la réouverture de 18 h, revendu à 9 h 30. Environ 1 324 $ par an, Sharpe 0,90 ; il bat des nuits tirées au hasard (p ≈ 0,0003). Indépendant de la zone (corrélation 0,02).","c":"bot","d":"cœur"},{"t":"Protections du bot","x":"Frein : la zone passe sur MES (5 fois plus petit) quand le compte est 750 $ sous son plus haut de fin de journée. Plafond de gain du jour : 500 $ sur le compte Master seulement, pour respecter la règle des 40 % et retirer plus tôt. Pas de zone les jours d'annonce de la Fed (seule confluence qui a battu le hasard parmi 8 178). Limite de perte du jour : 1 050 $.","c":"bot","d":"cœur"},{"t":"Bulenox 50K option 2","x":"Le compte choisi. Prix environ 19,25 $ avec code, puis 148 $ d'activation à la réussite. Challenge : objectif +3 000 $, perte max 2 500 $ sous le plus haut de fin de journée, bloquée à +100 $, limite du jour souple 1 100 $. Master : retrait après 10 jours de trading, meilleur jour ≤ 40 % du gain du cycle, garder 52 600 $, retraits de 1 000 à 1 500 $ (100 % pour toi). Après 3 retraits, compte réel aux règles inconnues. Règles tirées de sites d'avis : à vérifier.","c":"prop","d":"cœur"},{"t":"Pourquoi 3 700 $ en 24 mois","x":"Un achat Bulenox rapporte en médiane environ +3 700 $ nets en 24 mois parce que : les 8 premiers mois ne paient rien (challenge, puis coussin de 2 600 $ à construire), chaque retrait est limité à 1 500 $, et la simulation s'arrête au 3e retrait (compte réel inconnu). Maximum possible : 3 × 1 500 − 167 = 4 333 $. Pendant la phase de retraits, le rythme est d'environ 650-700 $ par mois.","c":"prop","d":"cœur"},{"t":"Prop firms comparées","x":"FundedNext Legacy : validation médiane ~5 mois, retraits ~1 087 $ toutes les 1,5 mois, mais plus cher. Bulenox : le meilleur pour un budget ≤ 30 €, 1er retrait vers le mois 8. LucidFlex 100K était le meilleur compromis de la vague 8 mais trop cher. FundedNext Flex 50K : limite de 1 500 $ trop serrée pour 1 MNQ. Topstep et Tradeify ferment chaque soir (d'où le RSI(2) de nuit sur MES).","c":"prop","d":"cœur"},{"t":"Monte Carlo Bulenox","x":"36 000 achats simulés avec le vrai moteur du bot, 24 mois chacun, faits de vraies séances 2012-2026 tirées par mois entiers. Achats rentables : 76 % si le filtre marche comme en 2026, 62 % s'il est deux fois plus faible, 42 % sans filtre. Validation en ~4 mois. Net médian +3 709 $. Stress « 2025 » : 15 % seulement, et le résultat dépend énormément du tirage du filtre (0 à 64 %). Moteur contrôlé : 5 040 achats sur 5 040 identiques au moteur exact.","c":"robustesse","d":"cœur"},{"t":"Labo de robustesse","x":"PBO (probabilité de suroptimisation) 30 % sur 14 400 bots, sans que le champion devienne jamais perdant. Hors échantillon : Sharpe du bot 1,29 sur 2012-2021, 1,40 sur 2023-2026. Walk-forward : ré-optimiser chaque année fait 5 829 $/an contre 6 943 $/an pour le bot fixe. 100 % des 14 400 variantes gagnent (Sharpe médian 0,98, bot au 99e centile). Zone contre pile ou face : p < 0,0001. Sharpe dégonflé 99,8 % pour la grille.","c":"robustesse","d":"cœur"},{"t":"Ta courbe (equity curve)","x":"Sur 2012-2026 au prix d'aujourd'hui, sans les règles du compte : bot avec filtre simulé 9 380 $/an, Sharpe 2,04, baisse max 5 199 $, toutes les années positives (la plus faible 2016 : +1 003 $). Sans filtre : 6 499 $/an, Sharpe 1,33, baisse max 4 590 $, 2016 à −2 440 $. Mélanger l'ordre des jours donne une baisse max de 6 873 $ une fois sur 20 : prévoir plus que l'historique.","c":"robustesse","d":"cœur"},{"t":"Suroptimisation","x":"Un backtest suroptimisé colle au bruit du passé et s'effondre ensuite. Défenses utilisées : règles fixées avant le calcul, jumeaux de bruit (la même recherche sur des données mélangées), coffre ouvert une seule fois, années de choix (2012-2021) séparées des années de vérification (2023-2026), PBO et Sharpe dégonflé.","c":"robustesse","d":"cœur"},{"t":"Walk-forward et hors échantillon","x":"Hors échantillon : juger un réglage sur des années qui n'ont pas servi à le choisir. Walk-forward : choisir le meilleur réglage sur les années passées, le jouer la période suivante, et recommencer. Efficacité = gain hors échantillon ÷ gain dans l'échantillon. Pour le bot : 63 % avec 3 ans de passé et 12 mois de jeu.","c":"robustesse","d":"cœur"},{"t":"Sharpe et statistiques","x":"Sharpe : gain moyen ÷ écart-type, annualisé ; au-dessus de 1 c'est bon. Sortino : ne compte que les baisses. Calmar : gain par an ÷ baisse max. Profit factor : dollars gagnés ÷ dollars perdus. VaR 95 % : un jour sur 20 est pire. Asymétrie positive : gains rares mais gros (signature de la zone).","c":"robustesse","d":"cœur"},{"t":"Databento","x":"Source des transactions du NQ (vrai delta) pour le filtre. Budget 1 $ par mois. Bloqué tant que le solde du compte Databento n'est pas réglé : le bot 3 en 1 virtuel est en pause depuis le 5 octobre 2026. Le bot C# dans Quantower calcule le vrai delta lui-même depuis le flux Rithmic, gratuitement.","c":"flux","d":"cœur"},{"t":"Robots virtuels","x":"Sur la branche main, GitHub lance chaque jour : le robot zone + RSI(2) (challenge virtuel depuis le 25 septembre 2026, −81 $ après 10 séances, dans la normale du backtest), le bot 3 en 1 virtuel (en pause, attend Databento), le robot de tendance multi-marchés et le mélange 50/50. Un bilan quotidien arrive à 15 h 07 (Paris).","c":"flux","d":"cœur"},{"t":"Tes objectifs","x":"Étudiant trader en France, sans revenu. Rester sur un compte 50K, viser environ 1 % par mois (~500 €), ou 2 % tous les 2 mois, même dans les années difficiles comme 2025. Un seul achat de challenge, pas de rachat, budget ≤ 30 €. Veut des résultats vérifiés, sans fausses promesses, et des protections quand le compte perd.","c":"toi","d":"cœur"},{"t":"Règles de sécurité","x":"Ne jamais écrire de clé, de jeton ou d'identifiant dans le dépôt, le chat ou ce cerveau. Les clés vivent dans les secrets GitHub. Ne jamais envoyer ses identifiants de prop firm ou de courtier. Le cerveau conseille, il ne passe jamais d'ordre et ne change pas les réglages du bot sans toi.","c":"toi","d":"cœur"},{"t":"Prochaines étapes","x":"1. Faire tourner le bot en démo Quantower et noter chaque trade écarté par le filtre (2-3 mois). 2. Régler Databento pour mesurer le filtre en virtuel. 3. Vérifier les règles Bulenox avant d'acheter. 4. Acheter le challenge Bulenox (~19 $) seulement si le filtre tient. 5. Plus tard : VPS pour faire tourner le bot la nuit, alertes Telegram du bot.","c":"toi","d":"cœur"},{"t":"Ton second cerveau","x":"Ce cerveau : chaque neurone est une note de ta recherche, reliée aux notes proches. Quand tu poses une question, il cherche les notes utiles, les allume, et Claude répond à partir d'elles. Dis « retiens que… » et il crée un nouveau neurone dans ta mémoire, privé, qui reste d'une visite à l'autre.","c":"toi","d":"cœur"},{"t":"Bot 3 en 1 pour Quantower (zone de bruit + filtre delta + RSI(2))","x":"Le bot qui trade pour de vrai, sur un compte Rithmic (par exemple DayTraders) avec Quantower. Il regroupe : - la zone de bruit (V1, zone/robot.py sur main) : contrôle toutes les 30 minutes de 10 h à 15 h 30, sortie au plus tard à 16 h (heure de New York) ; - le filtre delta (H1, orderflow/) : une entrée de zone n'est prise que si le delta (achats agressifs − ventes agressives) des 30 minutes du NQ va dans son sens. Le delta est lu en direct dans les transactions Rithmic, plus","c":"bot","d":"bot3en1"},{"t":"Second cerveau","x":"Un cerveau de neurones en 3D : chaque neurone est une note de la recherche. Page publiée : https://claude.ai/artifact/PGPr62imebYHe3k7GfpGvn (privée).","c":"recherche","d":"cerveau"},{"t":"Bot de challenge 50K (coussin)","x":"Objectif : valider un challenge futures 50K en moins d'un an. bot_challenge.py rejoue le bot sur les vrais prix (NQ minute 2011-2026 pour la zone de bruit, mélange tendance + achat pour la nuit). — Avantage : aucun de démontré. Sur 2011-2026, le Nasdaq a fait +394 % la nuit et seulement +127 % en séance. Fermer chaque soir retire l'essentiel de ce qui fait gagner la version 7. Le filtre momentum (la partie « version 7 ») bat seulement 5 % des tirages au hasard des mois achetés : il ne choisit pas de meilleurs mois. Challenge 50K (validé en 12 mois / par le seul hasard) :","c":"prop","d":"challenge"},{"t":"Plusieurs comptes Phidias, et moins de comptes perdus","x":"L'utilisateur demande deux choses (2 octobre 2026) : - ce que donnent plusieurs comptes Phidias en même temps avec la zone de bruit et le RSI(2) ; - comment éviter de repartir de zéro quand un compte est perdu. — comptes.py → comptes.txt. Contrôle : sans frein, le simulateur redonne exactement celui de zone_deux/. - Des comptes ouverts le même jour, avec les mêmes ordres, donnent exactement N fois le résultat d'un compte : ils gagnent et perdent ensemble. La chance de perdre de l'argent ne change pas. - Les comptes échelonnés ne font pas mieux sur 24 mois : les derniers ouverts ont moins de temps pour arriver au premier retrait. - Sur les départs 2011-2020 (en échantillon), chaque compte perd en moyenne 22 $ sur 24 mois, et","c":"prop","d":"comptes"},{"t":"DOGE : un mouvement brutal à 2 h, 13 h et 23 h ?","x":"Idée à tester : « tous les jours à 2 h, 13 h et 23 h (heure de Paris), le prix du DOGE part subitement dans une direction ». — 1. Mouvement dans les 15 minutes après l'heure (moyenne en valeur absolue) : 13 h et 23 h ne bougent pas plus que les autres heures. 2 h bouge un peu plus : c'est minuit UTC (fermeture de la bougie journalière des plateformes et paiement du financement des contrats perpétuels). Les heures les plus agitées sont 16 h et 17 h (ouverture de Wall Street). 2. Règles de trading : les 12 règles perdent après 0,10 % de frais. Le sens du mouvement n'est pas prévisible (suivre les 5 premières minutes ou l'heure d'avant perd m","c":"recherche","d":"doge"},{"t":"Machine évolutive : des stratégies qui naissent, sont testées et meurent (version honnête de SETS)","x":"Inspirée de SETS MACHINE (github.com/Shelpid/sets). Son propre README le dit : c'est « un jouet de recherche ». Il utilise 100 jours de BTC, dont 30 jours de test réutilisés à chaque génération, et l'achat simple y gagne plus que les stratégies. Ici, on garde la boucle (observer → muter → tester → sélectionner → déployer), mais pour un challenge 50K futures et avec des contrôles que SETS n'a pas. — 46 273 stratégies évaluées : 22 892 sur vraies données et 23 381 sur bruit, soit 5 graines de 60 générations chacune. Détail dans resultats_coffre.txt ; page de suivi dans tableau/. 1. Le contrôle sur bruit échoue. Sur des séances mélangées au hasard, la même machine trouve un meilleur Sharpe de validation (2,21) que sur les vraies données (1,72). Les leaders sur bruit ont un Sharpe d'entraînement de 1,0 à 1,8 : la sélection fabrique de belles stratégies à partir de rien. C'est le défaut de SETS, mesuré. 2. Le coff","c":"recherche","d":"evolution"},{"t":"Nouvelles pistes : GEX, murs d'options, VIX, DIX, profil de volume","x":"Après 57 stratégies intraday classiques sans survivant (tournois n°1 et n°2) et 180 conditions d'order flow sans effet (ordres/CONDITIONS.md), l'utilisateur demande d'autres pistes : GEX et 0DTE, call wall et put wall, heatmap, profil de volume, Level 1, quant… puis de les faire passer dans la machine évolutive.","c":"recherche","d":"evolution2"},{"t":"Machine évolutive n°3 : 5 marchés, 7 hypothèses, sélection naturelle","x":"L'utilisateur veut une exploration en masse, sur plusieurs marchés : des stratégies qui naissent, mutent, sont testées, puis gardées ou éliminées. La machine n°1 (evolution/) le faisait sur NQ et ES seulement, avec 4 espèces : rien n'a survécu, et la même machine faisait aussi bien sur du bruit. Celle-ci couvre 5 autres marchés et 7 familles d'hypothèses, avec les mêmes contrôles. — lancer3.py (8 graines réelles + 8 sur bruit, 80 générations, 6 minutes) → runs/, lancement3.log ; coffre3.py → resultats_coffre3.txt et .json ; comparaison par famille (descriptive) → familles3.txt. - 139 876 stratégies évaluées sur les vraies données, 139 915 sur bruit. Fitness ≥ 0,5 et porte passée : 13 585 sur les vraies données, 24 869 sur bruit. La machine trouve plus de « bonnes » stratégies dans des séances mélangées au hasard que dans les vraies. - Famille par famille, le bruit fait au moins aussi bien part","c":"recherche","d":"evolution3"},{"t":"Filtre H1 sur 15 ans : le grand backtest","x":"L'utilisateur veut un vrai backtest du filtre H1 avant de s'y fier. Il a donné son accord le 2 octobre 2026 pour acheter les données Databento nécessaires (« utilise tout ce qu'il te faut »). — Validation (22-25 septembre) avec la règle du tick : même signe que Databento dans 85,1 % des 1 430 fenêtres de 30 minutes, sous le seuil de 95 %. La source est refusée. - Le prix vendeur fourni ne sert à rien (accord du niveau du hasard). La règle du tick suit bien le delta minute par minute (corrélation 0,93 à 0,95), mais elle se trompe trop souvent sur le signe du cumul de 30 minutes, qui est un petit nombre. C'est justement ce que lit le filtre. - Un delta juste à 85 % ressemble à l'approximation par le prix dé","c":"bot","d":"filtre_h1"},{"t":"Fonds multi-stratégies","x":"Un fonds quantitatif ne cherche pas une stratégie miracle : il combine plusieurs sources de gain indépendantes, chacune modeste, et contrôle le risque de l'ensemble. Ce dossier est le moteur de ce fonds : chaque source est testée avec les mêmes règles, et seules celles qui passent entrent dans le portefeuille. — Données : barres journalières Databento (GLBX.MDP3) de 40 futures CME depuis juin 2010, contrat le plus échangé et le suivant (telecharger_futures.py, 3,76 $). 47 essais au total dans le projet. python3 moteur.py refait tout (1 minute) ; détails dans resultats.txt et resultats.json. Correction faite pendant la phase 3 : un marché sans cotation un jour donné (jour férié propre à ce marché) était retiré du portefeuille pendant un an par systeme.py, qui exige 256 jours pleins. Céréales et bétail n'étaient donc presque","c":"recherche","d":"fonds"},{"t":"Stratégies intraday pour challenge futures 50K","x":"Test des stratégies intraday les mieux documentées par la recherche, sur les micro-futures S&P (MES) et Nasdaq (MNQ), avec les frais réels (1 $ par ordre + 1 tick de glissement). — Données : barres d'une minute des futures ES et NQ de la CME (Databento, contrat le plus échangé), séance 9 h 30 – 16 h, janvier 2011 à septembre 2026, 3 917 séances complètes. Règles des articles, aucun paramètre ajusté. Frais : 0,90 point par aller-retour sur MES, 1,50 point sur MNQ. Détails : resultats_cme.txt, resultats_cme_challenges.txt, resultats_cme_verif_zone.txt. - Momentum de fin de séance : nul avant frais, perdant après, sur les 15 ans (confirme le test Yahoo). - OPR 5 minutes : perdant sur le S&P ; su","c":"recherche","d":"intraday"},{"t":"Le bot dans un challenge futures « intraday » à prix normal (règles fixées le 8 octobre 2026, avant le calcul)","x":"Pas de S2F DayTraders à 342 $. Il veut le bot dans des challenges 50K « normaux » à prix raisonnable (Bulenox, Apex, Alpha…). Si le RSI(2) l'empêche parce qu'il garde des positions la nuit, il faut l'enlever et chercher une autre source d'avantage adaptée à ces challenges. Si la limite de perte suivie pendant la journée pose problème, il faut le regarder aussi. — Contrôles : le moteur redonne exactement la zone de protection/ (+10 668,5 $ sur 2023 - 2026 sans limite), la somme des séances pour zone + RSI(2), et la partie 1 pour le RSI(2) seul ; la phase financée redonne les issues du challenge du moteur (309/309). Bots sans compte : zone seule +5,5 $ par séance (2012-2026), +11,1 $ (2023-2026) ; zone + RSI(2) entre deux clôtures +9,4 $ et +19,4 $. Challenges (bot Z + R, sans filtre ; réussis / perdus) :","c":"prop","d":"intraday50k"},{"t":"Machine 4 : une très grande recherche de 4e source pour le bot 3 en 1","x":"Demande de l'utilisateur (3 octobre 2026) : en attendant le test du filtre delta sur Rithmic, chercher parmi un très grand nombre de stratégies celles qui viendraient compenser ou s'ajouter au bot 3 en 1 (zone de bruit, RSI(2), filtre delta), quitte à baisser les exigences. — Même avec la barre baissée, la machine ne trouve rien qui se distingue du hasard. Le seul candidat qui ait un sens économique et qui aide le challenge sur 2023-2026 est l'achat d'un ZF les 5 dernières séances du mois : 12 trades par an, environ +1 200 $ par an au coffre, non corrélé au bot. Il n'est pas prouvé. Selon la règle, il va au suivi en argent virtuel. Comme la règle est entièrement mécanique, ce suivi peut se faire sur les données postérieures au 25 septembre 2026 sans rien changer au robot.","c":"recherche","d":"machine4"},{"t":"Monte Carlo du bot sur Bulenox 50K (11 octobre 2026)","x":"Page : monte_carlo_bulenox.html (artefact). La version 2 (plus bas) met le moteur du bot dans la page. — Lecture : - Le filtre décide presque tout. S'il est réel, environ 3 achats sur 4 rapportent de l'argent. S'il ne vaut rien, plus d'un achat sur deux perd. - Le régime récent valide plus lentement que les achats de 2023-2024 (4,7 mois contre 3,2). Il mélange les mois de 2025 et de janvier 2026, durs pour le bot. - Les gains du bot sont concentrés (avril 2025 : +6 393 $ à lui seul). Un chemin qui ne tire pas ces mois-là avance lentement. C'est pourquoi le stress 2025 est si mauvais alors que l'année 2025 entière a ga","c":"robustesse","d":"montecarlo"},{"t":"Dérive de nuit dans un compte de challenge « intraday »","x":"Sur 2011-2026, le Nasdaq a fait +394 % entre la clôture (16 h) et l'ouverture (9 h 30), contre +127 % en séance (challenge/resultats_version7_futures.txt). C'est une anomalie connue : Cliff, Cooper et Gulen (2008) ; Lou, Polk et Skouras (2019). Boyarchenko, Larsen et Whelan (2023, « The Overnight Drift », Fed de New York) la trouvent concentrée autour de l'ouverture européenne, et plus forte après une baisse en fin de séance américaine. — Le critère n'est pas rempli : pas de challenge simulé. - Pour information : la seule heure forte hors de la fenêtre testée est celle qui suit la clôture de 16 h (+1,1 point de base sur NQ), et une prop firm intraday ne la laisse pas garder. L'ouverture européenne (+1,2 pour la barre de 2 h) est dans la fenêtre testée, comme l'a relevé la revue. Même avec elle, la nuit autorisée rapporte à peine plus que les frais. - Après une séance en baisse, la nuit est un peu meilleure (+0,06 % contre +0,03 % sur NQ), comme le t","c":"flux","d":"nuit"},{"t":"Order flow sur le Nasdaq (NQ) : système d'apprentissage et de test","x":"L'utilisateur veut maîtriser l'order flow avant de prendre un challenge Phidias 50K, et a donné son accord le 2 octobre 2026 pour 75 $ de données au plus (3 téléchargements de 25 $ au plus). — Aucune stratégie order flow autonome ne bat le hasard après frais, ni parmi les cinq idées fixées d'avance, ni parmi plus de 40 000 combinaisons. Cela rejoint ordres/ (ES) : l'information de l'order flow existe, mais elle est plus petite que l'écart payé et les frais. - L'order flow sert comme filtre : ne prendre un trade de zone que si le delta des 30 dernières minutes va dans son sens. Sur les 6 mois (99 trades de zone), cela écarte 20 trades à −39,7 points en moyenne. La zone passe de +982 à +1 777 points, soit ","c":"flux","d":"orderflow"},{"t":"Order flow : delta, CVD, carnet, footprint, VWAP","x":"Peut-on gagner de l'argent avec ce que montrent les outils d'order flow (delta, CVD, footprint, DOM, Bookmap, VWAP) sur le future E-mini S&P 500, en tradant des micro-contrats MES ? — Transactions du ES : 23 séances du 24 août au 25 septembre 2026 (2 séances écartées : Labor Day et le jour où le contrat suivi n'était plus le plus échangé), environ 1 million de contrats par jour, écart acheteur-vendeur de 1 tick 99 % du temps. python3 analyse.py refait tout (resultats.txt, resultats.json). Borne haute (décile le plus favorable, mouvement du prix milieu) : Stratégies aux règles fixées (trades sans chevauchement, 1 MES) :","c":"flux","d":"ordres"},{"t":"Trading de paires (cointégration)","x":"Méthode des vidéos : corrélation, puis test ADF sur l'écart entre deux actifs, puis on trade le retour à la moyenne. paires.py la teste période par période (12 mois pour tester, 6 mois pour trader, entrée à 2 écarts-types, sortie à la moyenne, stop à 4), frais compris. — Visa/Mastercard est bien cointégrée si l'on regarde 2020–2024 après coup (p = 0,002), mais pas 2015–2019 (p = 0,11), et la paire ne rapporte rien en conditions réelles (+0 % sur 20 ans).","c":"recherche","d":"paires"},{"t":"Protéger le compte du bot 3 en 1 (règles fixées le 3 octobre 2026, avant le calcul)","x":"Le bot 3 en 1 (zone de bruit filtrée par le vrai delta + RSI(2), 1 MNQ chacun) a frôlé la perte le 29 juillet 2026. Rejoué minute par minute, il est descendu à 50 $ de la limite de Phidias. Chez DayTraders (compte Trail), la moitié des départs de juin et juillet sont perdus. L'utilisateur demande une protection contre ce genre de journée, et des résultats chez DayTraders aussi proches que possible de ceux de Phidias. — Le mélange rapporte beaucoup sur 15 ans (+3 617 $ par an à la taille du robot), mais il est fait pour un grand compte : un seul jour peut coûter 2 739 $, plus que la limite de 2 500 $. Ajouté au bot, il fait perdre plus d'un challenge sur deux, et les retraits S2F tombent de 83 % à 28 % des comptes. - Plus petit, les contrats entiers lui font perdre son avantage (−532 $ par an). - Ses années récentes : 2023 −4 248 $, 2024 −2 608 $, 2025 +7 064 $, 2026 +551 $. - Comme la tendance seule (piste 6), le mélange reste un","c":"bot","d":"protection"},{"t":"Labo de robustesse du bot 3 en 1 (11 octobre 2026)","x":"Demande de l'utilisateur : le même Monte Carlo (moteur du bot, relief 3D), mais beaucoup plus complet, avec son equity curve, le hors échantillon (« Oxford », compris comme *Out-Of-Sample* et walk-forward), la matrice de suroptimisation, la construction de portefeuille, la matrice des corrélations et la permutation des paramètres. Page : labo_bulenox.html (artefact), assemblée par construire_v3.py à partir de page_v3.html, des données du Monte Carlo (../montecarlo/donnees_v2. — Le bot n'est pas un pic isolé : les 14 400 bots gagnent tous de l'argent sans filtre (Sharpe médian 0,98). Mais ses réglages sont au 99e centile de la grille, d'où l'intérêt des tests suivants. - Suroptimisation modérée : le champion d'un découpage finit dans la moitié basse 30 % du temps (PBO), sans jamais devenir perdant. Les réglages du bot, fixés d'avance, sont en moyenne au 93e centile hors échantillon. - Hors échantillon : le bot fait mieux sur 2023-2026 (Sharpe 1,40) que sur 2012-2021 (1,29). Ré-optimiser ch","c":"robustesse","d":"robustesse"},{"t":"Secteurs américains : recherche d'abord, stratégie ensuite","x":"Reproduction de la méthode « recherche → hypothèses → critères fixés → backtest → journal des rejets → essayer de tuer le survivant », avec trois corrections : — Vrais rendements quotidiens de la version 7 (frais compris, sans intérêts sur les liquidités), une tentative par semaine, 12 mois au plus, pertes vérifiées en fin de journée (optimiste). Exposition m × version 7 (m = 1 : 25 000 $ en actions sur un compte de 50 000 $). - Futures (Topstep, Apex, Phidias) : impossible. Ces comptes ne permettent pas d'acheter des actions. Topstep et Apex interdisent en plus de garder une position la nuit. Les chiffres « Phidias » supposent que ce serait permis. Ils montrent que la pert","c":"recherche","d":"secteurs"},{"t":"Machine 5 : les anomalies des sessions Asie, Londres et New York (règles fixées le 8 octobre 2026, avant les données)","x":"Si le RSI(2) n'est pas bien adapté aux challenges 50K « intraday », le supprimer et le remplacer par une source d'avantage fiable. Analyser les phénomènes qui se répètent chaque jour, de l'ouverture à la fermeture de chaque session (Asie, Londres, New York). Trouver une source meilleure que le RSI(2), qui rapporte plus et qui ne soit pas bloquée par la limite de perte suivie pendant la journée ni par les règles de régularité. — (t sur 2012-2022 ; somme sur 2023 - 2026.) Non tradable sur la CME selon la règle fixée. Tout l'avantage se fait pendant la première heure du comptant (dimanche 17 h → 18 h), avant la réouverture du contrat 6A. À 18 h, l'écart est déjà comblé. De plus, les premières cotations du comptant le dimanche sont très larges : une partie de « l'écart » est sans doute un effet de cotation plutôt qu'un vrai prix. La vague 2 ne donne donc aucune source utilisable pour un compte de futures.","c":"recherche","d":"sessions24"},{"t":"Le bot 3 en 1 sur DayTraders Static 50K (règles fixées le 8 octobre 2026, avant le calcul)","x":"Il peut payer des comptes Static 50K de DayTraders (20 à 40 $ avec un code), autant qu'il faut. - Il faut adapter le bot au Static. Le RSI(2) reste s'il marche sur ce compte et s'il rapporte. Sinon, il sort, et la vague 3 cherche ce qui le remplace. - Le filtre delta reste dans la zone : l'utilisateur lui fait confiance. - Si une règle bloque chez une firme, on regarde les autres. - Il veut des résultats concrets, sans fausses hypothèses. — par_mois.py → par_mois.txt. Système retenu (E0 P500), au niveau d'aujourd'hui, sans les 130 $ d'activation. Un Static acheté le premier jour possible de chaque mois depuis 2012, chaque compte suivi 24 mois au plus. Contrôles : - la somme des retraits datés redonne le total du moteur ; - les retraits relevés séance par séance sont vérifiés à la main (test_static.py) ; - static.txt est inchangé. Un compte Pro qui tourne rapporte en moyenne 518 $ par mois :","c":"prop","d":"static50k"},{"t":"Système de tendance multi-marchés","x":"Système de suivi de tendance « à la CTA » sur 19 marchés futures (actions, taux, devises, métaux, énergie, crypto), testé sur les vrais prix depuis 2007, puis rejoué sur les règles d'un challenge Phidias Premium 50K. — Système idéal, positions divisibles à l'infini (2007–2026) : Sharpe 0,56, +10,9 %/an pour un risque de 19,5 %/an, pire baisse −36 %, 65 % d'années positives. Robuste aux réglages (Sharpe 0,46 à 0,65), aux coûts ×3 (0,47) et au retrait d'une famille (0,44 à 0,62). Mais 2023–2026 est négatif (Sharpe −0,16). Est-ce vraiment la tendance ? Un portefeuille qui achète tout, tout le temps (même risque par marché) fait aussi un Sharpe de 0,56, mais les deux ne sont presque pas corrélés (0,03) : la tendance gagne en 2008 (+1","c":"recherche","d":"tendance"},{"t":"Tournoi intraday : qui peut rivaliser avec la zone de bruit ?","x":"Des stratégies intraday connues, avec les paramètres de leur source, sans aucun réglage, testées sur le Nasdaq (NQ) et le S&P 500 (ES). La zone de bruit sert de référence. Chaque stratégie passe ensuite par la machine de tri (evolution/) : exploration, contrôle sur bruit, puis coffre ouvert une seule fois. — Détail dans exploration.txt, exploration.csv et reference_zone_coffre.txt. Étape 1 (t ≥ 2 sur 2011-2022) : aucune des 28 ne passe. Les meilleures : Toutes les autres sont négatives, et souvent nettement : sur l'ES, t de −1,5 à −6. L'achat simple intraday est lui aussi négatif (t −0,7 sur NQ, −1,5 sur ES) : les frais de chaque jour mangent la hausse.","c":"recherche","d":"tournoi"},{"t":"Tournoi 10 : de nouvelles progressions sur le NQ","x":"Demande de l'utilisateur du 2 octobre 2026 : chercher d'autres sources de gain sur le Nasdaq, en plus de la zone de bruit (intraday) et du RSI(2) (plusieurs jours). Ce tournoi ne reprend aucune famille déjà testée : stratégies intraday (tournois 1 à 7), tournant du mois et veille de la Fed (fonds/), veille de jour férié, IBS, Double 7, rebond de 5 jours (tournoi8/), nuit sans condition (nuit/), effets de calendrier (tournoi2/), tendance multi-marchés (tendance/), order flow ( — NQ, 2023 - septembre 2026 : 64 trades, 55 % gagnants, +1 990 $ pour 1 MNQ, mais t = 0,71 et il ne bat le hasard que dans 53,4 % des cas. Positif 3 années sur 4 (2026 : −486 $). Le gain vient de la hausse du Nasdaq, que n'importe quel achat aurait captée, pas du choix du lundi en baisse. ES (descriptif) : t = 1,35, 82,9 %. Le mardi de rebond est écarté.","c":"recherche","d":"tournoi10"},{"t":"Tournoi intraday n°2 : d'autres stratégies que la zone de bruit","x":"Même principe que le tournoi n°1 (tournoi/) : - réglages standards de chaque indicateur ou de sa source, sans aucun ajustement ; - testé sur le Nasdaq (NQ) et le S&P 500 (ES), séance de 9 h 30 à 16 h, tout fermé à 16 h ; - pas de trade les jours incomplets ni le jour d'un changement d'échéance ; - frais de 1,5 point de NQ et 0,9 point d'ES par aller-retour. — Code figé avant le calcul (commit 94d8a4a), puis corrigé après la revue (voir plus bas) ; tests dans test_concurrents2.py. Détail dans exploration.txt et exploration.csv. Étape 1 (t ≥ 2 sur 2011-2022) : aucune ne passe. Les moins mauvaises : Les 25 autres essais sont négatifs, de −0,4 à −35 : - Les 7 indicateurs populaires sur barres de 5 minutes (moyennes, Supertrend, MACD, Bollinger, RSI(2), Donchian) perdent tous sur les deux marchés, de t −0,5 (Supertrend NQ) à t −35 (RSI(2) ES). Ils tradent presque tous les jo","c":"recherche","d":"tournoi2"},{"t":"Tournoi intraday n°4 : les pistes pas encore vues","x":"Après 75 stratégies intraday sans survivant (tournois n°1 à n°3), une recherche de la littérature a fait ressortir des pistes que nous n'avions pas testées. Voici celles qui se testent avec nos données. — Détail dans exploration4.txt et coffre4.txt. Correction pendant le calcul : la stratégie 7 n'avait aucun trade. Son seuil sur 252 jours valait « rien » dès qu'une séance sans veille (un changement d'échéance) tombait dans la fenêtre. Le seuil porte maintenant sur les 252 dernières valeurs existantes, puis tout a été relancé. Paire en continuation (jugée seulement sur le coffre 2023-2026) : t −1,52, négative chaque année (−1,4 %, −0,5 %, −0,2 %, −0,8 %). Rejetée. En retour à la moyenne comme en continuation, la pair","c":"recherche","d":"tournoi4"},{"t":"Tournoi n°5 : les autres marchés et leurs rendez-vous","x":"Tout ce qui a été testé jusqu'ici tournait autour du Nasdaq et du S&P 500. Or les prop firms laissent aussi trader les devises, le pétrole, l'or, les taux et le bitcoin de la CME. Ces marchés ont leurs propres rendez-vous (fixing des devises, rapport sur le pétrole, adjudications du Trésor), étudiés dans des articles récents. Ce tournoi les teste.","c":"recherche","d":"tournoi5"},{"t":"Tournoi n°6 : des sources de gain sur d'autres marchés, à combiner avec la zone de bruit","x":"La zone de bruit seule ne suffit pas pour retirer de l'argent d'un compte financé (zone_retrait/). Son rapport gain/risque est trop faible. Il faut plusieurs sources de gain peu liées, qui tradent ensemble sur le même compte de challenge 50K. Chaque source doit être intraday : le compte Phidias Fundamental n'autorise pas les positions de nuit. — tournoi6.py → tournoi6.txt, etape1.csv. Contrôle : sur NQ, les 7 familles généralisées redonnent exactement les tournois 1 et 4. - 0 essai sur 35 atteint t ≥ 2 (environ 1 était attendu par hasard). 15 font t ≤ −2 : sur ces marchés, ces règles ne gagnent pas assez pour payer les frais. - L'euro (6E) est le pire : toutes les cassures font entre t −3 et −5,6. - Seule famille positive : le « rebond après une forte baisse », sur les indices actions. Russell t +1,23, Dow t +1,80 ; sur NQ t +1,80 et ES +1,48 sur 2011-2022","c":"recherche","d":"tournoi6"},{"t":"Tournoi n°7 : l'information des autres marchés","x":"Jusqu'ici, chaque stratégie ne regardait que le marché qu'elle trade. Les marchés sont pourtant liés : - les taux, le dollar et le pétrole bougent avec l'appétit pour le risque ; - l'or réagit au dollar ; - les petites capitalisations précèdent parfois les grandes. — tournoi7.py → tournoi7.txt, partieA.csv, hasard_max_t.txt. Contrôle : la règle simple redonne exactement entree_fixe des tournois sur les 7 marchés. - 0 essai sur 84 atteint t ≥ 2. Le meilleur fait t +0,45 (pétrole → Nasdaq, contrer). 33 font t ≤ −2 : les frais d'un trade par jour ne sont pas couverts. - Le contrôle global est net. Si l'on prend le signal d'un autre jour de la même année, le meilleur des 84 essais fait en médiane t +1,03 sur 200 tirages, et +2,09 au 95e centile. Le vrai signal du jour fait moins bi","c":"recherche","d":"tournoi7"},{"t":"Tournoi 8 : stratégies de plusieurs jours (NQ, ES)","x":"Phidias autorise les positions de nuit, de week-end et de plusieurs jours. Une stratégie de plusieurs jours, peu liée à la zone de bruit, pourrait donc tourner sur le même compte de challenge. L'utilisateur a donné son accord le 2 octobre 2026. Ce tournoi cherche cette deuxième source de gains. — L'original redonne exactement le coffre ci-dessus (+11 098 $, t 1,95) : même code, mêmes données. - Selon la règle fixée, la variante est utilisable (t 2,49 ≥ 2, et 65 % des dollars gardés). - Mais elle est faible là où le RSI(2) avait été validé : sur 2023 - 2026, elle ne garde que 41 % des dollars, avec t 0,90. Une grosse part du gain récent se fait pendant le week-end : en moyenne +32 points du vendredi 15 h 50 au lundi 9 h 30, sur 101 week-ends. - Elle ne fait mieux que l'original que 5 années sur 15 (2012, 201","c":"recherche","d":"tournoi8"},{"t":"Tournoi 9 : une troisième source, sur d'autres marchés","x":"La zone de bruit (NQ, intraday) et le RSI(2) (NQ, plusieurs jours, achat après une baisse) jouent tous les deux le Nasdaq. Une troisième source vraiment indépendante devrait venir d'autres marchés : or, pétrole, euro, obligations américaines. Demande de l'utilisateur du 2 octobre 2026. — tournoi9.py → exploration9.txt, exploration9.csv. Tests : test_tournoi9.py, 5 contrôles passés (rendements sans saut d'échéance, aucun regard vers le futur, fin de mois au calendrier, trade à la main, placements au hasard fidèles). Détail d'exécution précisé en codant, sans voir de résultat : les séances courtes des jours fériés de la Bourse (le CME ouvre parfois) sont fusionnées avec la séance suivante, pour garder une décision par vraie séance. Les variations journalières de plus de 50 % (pétrole sous zéro, avril","c":"recherche","d":"tournoi9"},{"t":"Vague 10 : freins contre les séries de pertes, un seul achat (règles fixées le 9 octobre 2026, avant le calcul)","x":"Un seul achat de 50K : pas de rachat. Il faut savoir ce que rapporte ce compte-là et s'il survit. - Limiter les pertes : se protéger quand ça tourne mal, au lieu de laisser les pertes brûler le compte. - Ne pas faire de 2025 une année KO. — Verdict fixé à l'avance : aucune candidate n'est sûre sur les achats 2012-2021. Sur cette période, toutes perdent plus de 20 % des comptes financés dans l'année. Rien n'est donc « validé » au sens strict. Mais un frein change tout sur la période récente : passer la zone sur MES dès que le compte recule de 500 $ sous son plus haut (coussin sous 1 500 $), et revenir au MNQ quand il remonte. FundedNext Legacy 50K, garder 4 000 $ après chaque retrait, pas de zone les jours de la Fed, un seul achat :","c":"prop","d":"vague10"},{"t":"Vague 11 : adapter le bot à Bulenox 50K pour retirer plus vite (règles fixées le 9 octobre 2026, avant le calcul)","x":"Il choisit Bulenox (≈ 19 $ + 148 $ d'activation), mais il trouve les gains trop petits : environ 1 400 $ tous les 3 à 4 mois, contre environ 1 100 $ tous les 1,5 mois pour FundedNext Legacy. Il veut adapter le bot à Bulenox. — Un seul achat Bulenox 50K, achats suivis 24 mois : Verdict fixé à l'avance : choisi = plafond de 500 $, NON VALIDÉ. En vérification, l'argent net sur 24 mois est presque le même (+3 744 $ contre +3 835 $), alors que la règle demandait au moins autant. Ce que ce critère ne voit pas : chez Bulenox, le compte passe en réel après 3 retraits, et la simulation s'arrête là. L'argent net sur 24 mois plafonne donc vers 3 × 1 400 $ dans les deux cas. La vraie différence est la vitesse : - le 3e retrait arrive 4 mois plus tôt","c":"prop","d":"vague11"},{"t":"Vague 3 : de nouvelles sources de plusieurs jours pour le système Static (règles fixées le 8 octobre 2026, avant le calcul)","x":"Demande de l'utilisateur (8 octobre 2026) : faire A (adapter le bot au Static, static50k/) puis B, une vague 3 qui cherche d'autres sources que le RSI(2), pour le remplacer ou s'ajouter à la zone filtrée. — Contrôles (test_vague3.py, 5 sur 5) : - fenêtres d'octobre et d'avril 2022 (Vendredi saint) ; - semaines du cycle de la Fed autour de l'annonce du 21 septembre 2022 ; - écart ES - ZN de juin 2019 recalculé à la main et comparé au moteur ; - journal d'une vente ; - pas de regard vers le futur. Correction après la revue de code : - Le défaut. L'écart ES - ZN de W3 et W4 divisait des prix de deux échéances différentes quand le mois contenait un changement de contrat (mars, juin, septembre, décembre). C'était un saut d","c":"prop","d":"vague3"},{"t":"Vague 4 : remplacer le RSI(2) sur les challenges qui ferment chaque soir (règles fixées le 9 octobre 2026, avant le calcul)","x":"Demande de l'utilisateur (9 octobre 2026) : - garder le RSI(2) seulement sur un challenge 50K pas cher où il tient bien le mois ; - sinon, le remplacer par une autre source qui s'ajoute à la zone seule, filtre delta compris si possible. — Contrôles (test_vague4.py, 4 sur 4) : - le nouveau moteur redonne financee.py sur 248 parcours ; - un trade de nuit seulement et un trade sur MES sont recalculés à la main ; - la nuit de l'ES suit la même règle que celle du NQ ; - la largeur d'un jour est recalculée à la main, sans regard vers le futur. Une revue de code indépendante a demandé des corrections, toutes faites avant ces résultats : - la limite du jour suit la position nette, comme financee.py ; - le tableau des retraits par mois a été ajouté ; - les c","c":"prop","d":"vague4"},{"t":"Vague 5 : 500 à 850 $ par mois avec un seul compte, règles comprises (règles fixées le 9 octobre 2026, avant le calcul des leviers)","x":"Le bot seul fait 500 à 850 $ par mois. Avec les règles d'un compte 50K, il ne reste que 140 à 410 $. - Il faut trouver comment gagner 500 à 850 $ par mois avec les règles, sur un seul compte. - On peut enlever ce qui ne rapporte pas assez. - Le filtre delta est à compter comme acquis dans la stratégie. — Le calcul est fidèle aux règles connues : - chaque trade est au niveau d'aujourd'hui de son jour d'entrée ; - un compte est gardé tant qu'il vit ; - la règle d'activité de DayTraders est appliquée. Contrôles : test_vague5.py 8 sur 8, test_static.py 10 sur 10, test_vague4.py 5 sur 5. Retenue et validée : Topstep, zone + A3, challenge 2×, financé 2× dès 4 000 $ de coussin. - Elle fait +557 $ par mois sur le choix 2012-2022 et +388 $ en vérification (2023 +370, 2024 +600, 2025 +170, 2026 +419). L'objectif de 500 $ n'e","c":"prop","d":"vague5"},{"t":"Vague 6 : des comptes aux règles plus favorables, et une taille 3× pendant le challenge (règles fixées le 9 octobre 2026, avant le calcul)","x":"1. Chercher des comptes aux règles plus favorables à ce bot : plafond de retrait plus haut, pas de règle d'activité, plancher qui ne bouge pas. 2. Pousser la taille pendant le challenge à 3×, puisque le 2× a aidé partout. — Une revue indépendante a relevé deux défauts, corrigés, et tout a été recalculé : 1. LucidFlex : le moteur plafonnait chaque retrait à 50 % du gain total, au lieu de 50 % du gain du cycle (depuis le dernier retrait). Corrigé (part_cycle dans moteur4.py). Retirer moins à chaque fois laisse plus de coussin : LucidFlex passe de +630 / +362 $ à +593 / +481 $ par mois. 2. S2L avec une limite du jour définitive : la taille 2× ne s'activait jamais (coussin mesuré contre le plancher du jour). Corrigé ; cette ligne descript","c":"prop","d":"vague6"},{"t":"Vague 7 : le mélange de tout ce qui a marché, puis le meilleur challenge 50K (règles fixées le 9 octobre 2026, avant le calcul)","x":"Continuer à chercher. Au pire, additionner les sources d'avantage qui ont marché (zone de bruit, filtre delta…), ne garder que celles qui rapportent le plus, puis voir quel challenge 50K à prix raisonnable convient le mieux au bot. — Contrôles : - test_vague7.py 2 sur 2 : le signal du rebond est celui du robot (379 jours) ; un jour de rebond est recalculé à la main sur les deux moteurs ; - sans rebond, vague5_regles.txt est redonné à l'identique, Topstep et le Static redonnent les chiffres de la vague 6, et les contrôles du Static et des vagues 4, 5 et 6 passent. 1. Le rebond ne reste sur aucun compte : aucun ne fait mieux à la fois sur le choix et sur la vérification. Le rebond seul gagne surtout dans les krachs, et il est négatif ou faible le","c":"prop","d":"vague7"},{"t":"Vague 8 : la bonne taille (règles fixées le 9 octobre 2026, avant le calcul)","x":"Tout revérifier. Comprendre pourquoi, même avec les réglages prudents, on perd encore la moitié des challenges et la plupart des comptes financés achetés en 2025, alors que le bot gagne à peine 1 % par mois. Viser au moins 1 % par mois (≈ 500 $ sur un 50K) et au moins 10 % par an, sans perdre le compte ; si un compte doit être perdu, que ce soit après assez de gains pour en racheter un. Chercher d'autres sources d'avantage si besoin. Rester sur des challenges 50K à prix raiso — Filtre simulé aussi bon qu'en 2026 (10 tirages). « Gain net par mois » = un seul compte à la fois, racheté s'il est perdu, retraits × part − prix. Verdict fixé à l'avance : aucune candidate sûre et validée ; l'objectif de 500 $ par mois n'est pas atteint. - 23 candidates sur 60 sont sûres sur les achats 2012-2021, toutes des LucidFlex 100K ou 150K. - Sur la vérification, elles gardent le compte : - challenge perdu 0 à 1 % ; - compte financé perdu dans les 12 mois 0 à 5 %. - Mais elles échouent à « chaque année posi","c":"prop","d":"vague8"},{"t":"Vague 9 : confluences sur la zone, jugées sur l'objectif du 50K (règles fixées le 9 octobre 2026, avant le calcul)","x":"Rester sur un 50K. Trouver une alliance de confluences, bots ou variantes, comme la zone + le filtre delta, qui fasse valider le challenge sans brûler le compte. Des mois de perte sont acceptés si les gains les compensent largement. Objectif : 1 % par mois (ou 2 % tous les 2 mois), y compris dans des années comme 2025. Chercher en grand. — Premier jugement (objectif tenu le plus souvent). Sur 8 178 règles, seules 2 font mieux que le bot sur le choix ET sur la vérification. Ce sont les deux versions de « pas de zone les jours d'annonce de la Fed ». Cette règle passe les trois tests fixés à l'avance : - elle bat les 10 jumeaux de bruit (68,2 % contre 64,3 à 67,7 %) ; - elle fait mieux en vérification ; - elle bat 100 % des filtres au hasard. Elle est retenue, mais son effet est petit. Avec le moteur exact (plancher minute par minute, retraits, prix) : ","c":"prop","d":"vague9"},{"t":"Zone de bruit + RSI(2) sur un même compte : quelle taille ?","x":"Le RSI(2) sur le NQ a passé le tournoi 8 (tournoi8/). Il est indépendant de la zone de bruit (corrélation ≈ 0). Avec deux sources dont les pertes ne tombent pas les mêmes jours, le même risque autorise peut-être une taille plus grande. Pour la zone seule, aucune des 128 gestions testées ne faisait mieux que la gestion actuelle de façon fiable (zone_retrait/). — taille2.py → taille2.txt, grille2.csv. Contrôle : sans RSI(2), le simulateur redonne exactement celui de zone_retrait/. - Choix sur 2011-2020 : f = 0,25 sur le compte financé avant blocage de la limite, 0,15 ailleurs (+134 $/an, contre −8 $/an pour la gestion actuelle). - Contrôle 2023-2024 : la gestion choisie fait −7 $/an (rien reçu dans 71 % des cas), la gestion actuelle +254 $/an (rien reçu dans 27 % des cas). Non adoptée. - Sur 12 mois (départs 2023-2025) : −218 $/an pour la choisie, −115 $/an pour l'actuelle.","c":"bot","d":"zone_deux"},{"t":"Zone de bruit NQ : failles et corrections","x":"L'utilisateur laisse tomber les autres pistes et veut rendre la zone de bruit sur MNQ plus solide. Il faut d'abord trouver ses failles, puis tester des corrections sans se raconter d'histoires : chaque réglage essayé sur les données passées augmente le risque de trouver un faux progrès. — variantes.py refait tout (variantes.txt). Chiffres : t des rendements quotidiens nets sur NQ. Pourquoi les rejets : - V2, V3 et V4 sauvent 2011-2016 mais font moins bien sur 2017-2022. - V5 fait mieux sur les deux moitiés mais moins bien sur 2023-2026. Le t de sa différence avec V1 y vaut −0,38. - V3 (GEX) est le piège typique : t 1,99 sur 2011-2022, la meilleure sur le passé. Mais sur 2023-2026, elle fait 1,38 contre 2,00 pour V1. Sans le tri, on l'aurait adoptée à tort. Sur ES, V1 ne change rien (t −1,72) et tout","c":"bot","d":"zone_failles"},{"t":"Zone de bruit sur plusieurs marchés (bot de challenge plus régulier)","x":"Objectif : rendre le bot de challenge plus régulier en appliquant la zone de bruit (Zarattini, Aziz et Barbon ; intraday/strategies.py) à plusieurs marchés à la fois. Sur NQ seul : t = 2,55. Sur ES seul : t = −1,0. — \\* NQ et ES : 2011-2026 ; sur 2016-2026, NQ fait +13,86 $ (t +2,82) et ES −0,49 $ (t −0,19). Les autres marchés : 2016 (Russell : 2017) - 2026. Portefeuille à risque égal (2016-2026) : Sharpe −1,45, t −4,78, contre Sharpe 0,86 pour NQ seul. Négatif dans les deux sous-périodes. Critères non remplis : pas de challenge simulé. - La cassure de la zone de bruit ne gagne, avant frais, que sur les deux grands indices américains (NQ et ES). Sur les 5 autres marchés, elle est à zéro avant frais : les frais la rendent perdan","c":"bot","d":"zone_multi"},{"t":"Zone de bruit NQ : optimiser sans se tromper, et savoir quand elle marche","x":"L'utilisateur veut un meilleur t hors échantillon et savoir dans quelles conditions la zone fonctionne. Régler la zone sur 2023-2026 rendrait ces années « dans l'échantillon » et gonflerait le t : c'est ce qu'a montré le filtre GEX, meilleur sur le passé et moins bon ensuite (zone_failles/). On utilise donc l'optimisation glissante, la seule façon d'avoir un vrai chiffre hors échantillon. — glissante.py → glissante.txt ; conditions.py → conditions.txt. test_moteur.py vérifie que le moteur réglé redonne exactement V1. Aucune ne remplit le critère : toutes font mieux que V1 sur 2014-2022, toutes font moins bien sur 2023-2026. Les réglages qui gagnaient dans le passé (zone plus large, stop sur le VWAP, 28 jours) ne gagnent pas ensuite. V1 reste.","c":"bot","d":"zone_optimisation"},{"t":"Zone de bruit NQ : retirer plus du compte financé","x":"L'utilisateur veut retirer plus. Avec la gestion actuelle du robot, presque aucun départ ne touche d'argent en 12 mois (zone_taille/ : médiane 0 $, 93 à 97 % des départs à 0 $). Deux étapes : corriger les règles de retrait du robot, qui étaient périmées, puis optimiser ce que l'on contrôle. — retrait.py → retrait.txt, grille.csv. Contrôle de départ : le simulateur rapide donne exactement les mêmes carrières que une_journee du robot, sur 12 carrières tirées au hasard. - Toutes les gestions perdent de l'argent sur 2011-2020 une fois les challenges payés. La médiane des 128 fait −497 $ par an. La gestion actuelle est 5e. Les 10 meilleures sont toutes proches d'elle : f = 0,15 ou 0,25, et 0,15 une fois la limite bloquée. - La choisie ne passe pas le contrôle : −70 $ par an contre −22 $ pour l'actuelle sur 2","c":"bot","d":"zone_retrait"},{"t":"Zone de bruit NQ : de nouvelles sources d'avantage","x":"Les réglages sont épuisés (zone_optimisation/ : même l'oracle ne gagne presque rien). La zone ne regarde qu'une chose : le prix du NQ comparé à sa zone. Les pertes viennent des fausses cassures, coupées en 30 minutes. On cherche donc des informations que la zone n'utilise pas et qui pourraient distinguer une vraie cassure d'une fausse, ou ajouter un gain qui ne dépend pas d'elle. — sources.py → sources.txt. Contrôle : le moteur sans const jeParle = () => !!(voix.enCours || voix.file.length);
const jeParlaisALInstant = () => jeParle() || performance.now() - voix.finA < 1500;
function entendre(fin, inter) {
  fin = fin.trim(); inter = inter.trim();

    if (estEcho(fin) || motsLongs(fin).length < 2) return;

    if (!fin || motsLongs(fin).length < 2) return;

}
function finDePhrase() {
  const q = (sess.texte + " " + sess.inter).trim(); sess.texte = ""; sess.inter = "";
  if (q && sess.actif && sess.etat === "ecoute" && !ctl) envoyer(q, {vocal: true});
}
function interrompre() { sess.tour++; if (ctl) ctl.abort(); taire(); sess.texte = ""; sess.inter = ""; if (sess.actif && sess.etat !== "pause") etatVoix(sess.dictee ? "dictee" : "ecoute"); }
function couperReco() { const r = sess.reco; sess.reco = null; if (r) { try { r.abort(); } catch (e) {} } }
function lancerReco() {
  if (!sess.actif || sess.dictee || sess.etat === "pause" || sess.reco) return;
  let r;
  try { r = new SR(); } catch (e) { passerEnDictee("absent"); return; }
  sess.reco = r; r.lang = "fr-FR"; r.continuous = true; r.interimResults = true; r.maxAlternatives = 1;
  r.onresult = e => { let fin = "", inter = ""; for (let k = e.resultIndex; k < e.results.length; k++) { const t = e.results[k][0].transcript; if (e.results[k].isFinal) fin += t; else inter += t; } entendre(fin, inter); };

function reprendre() { sess.echecs = 0; etatVoix(sess.dictee ? "dictee" : "ecoute"); if (sess.dictee) $("a-dictee").focus(); else lancerReco(); }

// --- si le micro est bloqué dans la page : la dictée de l'appareil ---
const UA = navigator.userAgent, MOBILE = /Mobi|Android|iPhone|iPad/i.test(UA);
const CONSEIL = !MOBILE && /Windows/i.test(UA) ? {note: "Clique dans la case ci-dessous, puis appuie sur Windows + H et parle (pour ne plus rien toucher du tout : l'Accès vocal de Windows, dans Paramètres → Accessibilité → Voix)", place: "Clique ici, puis Windows + H et parle…"}
  : !MOBILE && /Macintosh/i.test(UA) ? {note: "Clique dans la case ci-dessous, puis lance la dictée du Mac (touche micro, ou Fn deux fois) et parle", place: "Clique ici, puis lance la dictée et parle…"}
  : {note: "Touche le micro de ton clavier et parle", place: "Touche le micro de ton clavier et parle…"};
function passerEnDictee(raison) {
  sess.dictee = true; couperReco();
  const pourquoi = raison === "absent" ? "Ce navigateur ne sait pas écouter dans une page web." : raison === "network" ? "La reconnaissance vocale de ton navigateur n'est pas joignable." : "Le micro est bloqué pour cette page.";
  $("a-note").textContent = pourquoi + " " + CONSEIL.note + " : j'envoie tout seul dès que tu t'arrêtes, et je te réponds à voix haute.";
  $("a-dictee").placeholder = CONSEIL.place;
  $("a-note").hidden = false; $("a-dictee").hidden = false;
  if (sess.etat !== "parle" && sess.etat !== "reflexion") etatVoix("dictee");

  try { $("a-dictee").focus(); } catch (e) {}
}
function envoyerDictee() { clearTimeout(minuteurDictee); const v = $("a-dictee").value.trim(); if (!v || ctl) return; $("a-dictee").value = ""; envoyer(v, {vocal: true}); }

// --- réveil : la seule touche ---
function reveiller() {
  if (sess.actif) return;
  sess.actif = true; sess.dictee = !SR; remplirVoix(); fermerFiche();
  if ("speechSynthesis" in window) { etatVoix("parle"); voix.fini = true; dire(TOURS.length ? "Re-salut, c'est Claude. On reprend où on en était ?" : "Salut, c'est Claude. Je t'écoute, vas-y."); }
  else etatVoix("ecoute");
  if (sess.dictee) passerEnDictee("absent"); else lancerReco();
}
function clicPastille() {
  if (!sess.actif) return reveiller();
  if (sess.etat === "parle" || sess.etat === "reflexion") interrompre();
  else if (sess.etat === "pause") reprendre();
  else if (sess.etat === "ecoute") mettreEnPause();

function basculerTexte(ouvrir) {
  const p = $("panneau"), o = ouvrir === undefined ? p.classList.contains("ferme") : ouvrir;
  p.classList.toggle("ferme", !o); document.body.classList.toggle("avec-texte", o); $("b-texte").setAttribute("aria-pressed", String(o));
  $("b-texte").setAttribute("aria-label", o ? "Cacher la conversation écrite" : "Voir la conversation écrite");
  setTimeout(cadrer, 330);
}
function versionOrale(q, hits, t) {
  if (/^\s*retiens/i.test(q) || !hits.length) return t;
  const n = notes[hits[0].i], phrase = (n.x.match(/^[\s\S]*?[.!?](?=\s|$)/) || [n.x])[0].slice(0, 240);
  return `Je n'ai pas accès à Claude ici, alors je te lis mes notes. ${n.t}. ${phrase}`;
}

accueil();
const ok3d = typeof THREE !== "undefined" && initScene();
if (!ok3d && typeof THREE === "undefined") $("scene").innerHTML = '<p style="padding:24px;color:#a6aec4">Le cerveau 3D n\'a pas pu se charger (three.js) : la conversation marche quand même.</p>';
$("saisie").addEventListener("submit", e => { e.preventDefault(); if (ctl) { ctl.abort(); return; } envoyer($("question").value); });
$("question").addEventListener("input", ajusterSaisie);
$("question").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); if (!ctl) envoyer($("question").value); } });

$("o-effacer").onclick = () => { if (ctl) ctl.abort(); TOURS.length = 0; fil.innerHTML = ""; accueil(); sauverFil(); epinglesReponse = []; EPINGLE.fill(0); };
$("a-etat").onclick = clicPastille;
$("b-micro").onclick = () => { if (!sess.actif) return reveiller(); if (sess.etat === "pause") reprendre(); else mettreEnPause(); };
$("b-texte").onclick = () => basculerTexte();
$("a-voix").onchange = () => { garderLocal("cerveau-voix", $("a-voix").value); if (!jeParle() && sess.etat !== "reflexion") { taire(); dire("Voilà ma nouvelle voix."); } };
$("a-dictee").addEventListener("input", () => { clearTimeout(minuteurDictee); if ($("a-dictee").value.trim()) minuteurDictee = setTimeout(envoyerDictee, 1700); });
$("a-dictee").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); envoyerDictee(); } });
addEventListener("keydown", e => { if (e.key === "Escape") { if (!$("fiche").hidden) fermerFiche(); else if (document.body.classList.contains("avec-texte")) basculerTexte(false); } });
if ("speechSynthesis" in window) { speechSynthesis.getVoices(); speechSynthesis.addEventListener?.("voiceschanged", remplirVoix); }
(async () => {
